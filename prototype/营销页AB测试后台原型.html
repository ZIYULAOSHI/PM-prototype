<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化王管理后台 - 营销页管理</title>
<style>
:root {
  --bg: #f4f5f8;
  --surface: #fafbfd;
  --sidebar-bg: #1a1d24;
  --sidebar-text: #9ba3b4;
  --sidebar-active: #e8edf5;
  --sidebar-active-bg: rgba(74, 108, 247, 0.1);
  --text: #1e2130;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: #e5e7ed;
  --accent: #3b6df0;
  --primary: #3b6df0;
  --accent-light: #e8edf9;
  --danger: #e5484d;
  --danger-light: #fef2f2;
  --success: #30a46c;
  --success-light: #eef9f2;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Sidebar */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  user-select: none;
}

.sidebar-logo {
  padding: 20px 18px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.sidebar-logo h1 {
  font-size: 16px;
  font-weight: 700;
  color: #e8edf5;
  letter-spacing: .5px;
}

.sidebar-logo span {
  font-size: 11px;
  color: var(--sidebar-text);
  display: block;
  margin-top: 2px;
  font-weight: 400;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.nav-section {
  margin-bottom: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  padding: 9px 18px;
  color: var(--sidebar-text);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 13px;
  gap: 10px;
  border-left: 2px solid transparent;
  text-decoration: none;
}

.nav-item:hover {
  color: #c8cedb;
  background: rgba(255,255,255,0.03);
}

.nav-item.active {
  color: #c8d4f7;
  background: rgba(59, 109, 240, 0.12);
  border-left-color: var(--accent);
  font-weight: 600;
}

.nav-item .icon {
  width: 18px;
  height: 18px;
  opacity: 0.6;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-item.active .icon { opacity: 0.9; }

.nav-group-header {
  display: flex;
  align-items: center;
  padding: 9px 18px;
  color: var(--sidebar-text);
  cursor: pointer;
  font-size: 13px;
  gap: 10px;
  transition: all var(--transition);
}

.nav-group-header:hover {
  color: #c8cedb;
  background: rgba(255,255,255,0.03);
}

.nav-group-header .arrow {
  margin-left: auto;
  font-size: 10px;
  transition: transform var(--transition);
}

.nav-group.open .nav-group-header .arrow {
  transform: rotate(90deg);
}

.nav-sub {
  overflow: hidden;
  max-height: 0;
  transition: max-height 250ms ease;
}

.nav-group.open .nav-sub {
  max-height: 200px;
}

.nav-sub .nav-item {
  padding-left: 46px;
  font-size: 12.5px;
}

/* Main Area */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-bar {
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  flex-shrink: 0;
}

.breadcrumb {
  font-size: 13px;
  color: var(--text-secondary);
}

.breadcrumb span {
  color: var(--text-muted);
  margin: 0 6px;
}

.breadcrumb .current {
  color: var(--text);
  font-weight: 600;
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

/* Page Header */
.page-header {
  margin-bottom: 18px;
}

.page-header h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

/* Filter Bar */
.filter-bar {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.filter-bar input[type="text"],
.filter-bar select {
  height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 10px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  transition: border-color var(--transition);
  outline: none;
}

.filter-bar input[type="text"]:focus,
.filter-bar select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.filter-bar input[type="text"] {
  width: 220px;
}

.filter-bar select {
  width: 130px;
}

.filter-bar input::placeholder {
  color: var(--text-muted);
}

.btn {
  height: 34px;
  padding: 0 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  font-weight: 500;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover {
  background: #2f5cd6;
}

.btn-default {
  background: #fff;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-default:hover {
  background: var(--bg);
  border-color: #cdd2db;
}

.btn-new {
  margin-left: auto;
}

.btn-danger-text {
  color: var(--danger);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius);
}
.btn-danger-text:hover {
  background: var(--danger-light);
}

.btn-edit-text {
  color: var(--accent);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius);
  margin-right: 2px;
}
.btn-edit-text:hover {
  background: var(--accent-light);
}

/* Table */
.table-container {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  background: #f8f9fb;
  padding: 11px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  text-transform: none;
  letter-spacing: 0;
}

tbody td {
  padding: 12px 14px;
  font-size: 13px;
  border-bottom: 1px solid #f0f1f5;
  color: var(--text);
  vertical-align: middle;
}

tbody tr:last-child td {
  border-bottom: none;
}

tbody tr:hover {
  background: #fafbfd;
}

.td-ellipsis {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Status Badge */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
}

.status-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.status-badge.running { color: var(--success); }
.status-badge.running::before { background: var(--success); }
.status-badge.paused { color: var(--warning); }
.status-badge.paused::before { background: var(--warning); }
.status-badge.draft { color: var(--text-muted); }
.status-badge.draft::before { background: var(--text-muted); }

/* Weight Bar */
.weight-bar {
  display: flex;
  align-items: center;
  gap: 6px;
}

.weight-bar-track {
  flex: 1;
  height: 6px;
  background: #e8eaef;
  border-radius: 3px;
  overflow: hidden;
  max-width: 60px;
}

.weight-bar-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 3px;
}

.weight-bar-text {
  font-size: 12px;
  color: var(--text-secondary);
  min-width: 32px;
}

/* Group Tags */
.group-tags {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.group-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
}

.group-tag-a { background: #eef2ff; color: #4f46e5; }
.group-tag-b { background: #ecfdf5; color: #047857; }
.group-tag-c { background: #fef3c7; color: #b45309; }
.group-tag-d { background: #fdf2f8; color: #be185d; }
.group-tag-e { background: #eff6ff; color: #2563eb; }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 14px 20px;
  gap: 6px;
  border-top: 1px solid #f0f1f5;
}

.pagination .page-info {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-right: 10px;
}

.pagination button {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: all var(--transition);
  font-family: var(--font);
}

.pagination button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.pagination button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

.pagination button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  cursor: pointer;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.switch .slider {
  position: absolute;
  inset: 0;
  background: #d1d5db;
  border-radius: 22px;
  transition: all 200ms ease;
}

.switch .slider::before {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  left: 2px;
  bottom: 2px;
  background: #fff;
  border-radius: 50%;
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 1px 2px rgba(0,0,0,0.12);
}

.switch input:checked + .slider {
  background: var(--success);
}

.switch input:checked + .slider::before {
  transform: translateX(18px);
}

/* Delete Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 150ms ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  animation: slideUp 200ms cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { transform: translateY(12px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 8px;
}

.modal p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Right Side Drawer */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 200ms ease, visibility 200ms ease;
}

.drawer-overlay.open {
  opacity: 1;
  visibility: visible;
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: 560px;
  height: 100vh;
  background: var(--surface);
  box-shadow: -4px 0 20px rgba(0, 0, 0, 0.12);
  z-index: 1000;
  transform: translateX(100%);
  transition: transform 250ms cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.drawer.open {
  transform: translateX(0);
}

.drawer-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.drawer-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin: 0;
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.drawer-footer {
  padding: 20px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

/* Edit Form */
.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-group label .required {
  color: var(--danger);
  font-size: 14px;
  line-height: 1;
}

.form-group .hint {
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 4px;
}

.form-group select,
.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="date"],
.form-group textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  outline: none;
  transition: border-color var(--transition);
}

.form-group select:focus,
.form-group input[type="text"]:focus,
.form-group input[type="number"]:focus,
.form-group input[type="date"]:focus,
.form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.form-group textarea {
  min-height: 80px;
  resize: vertical;
  line-height: 1.6;
}

/* Disabled form state for view mode */
.form-group select:disabled,
.form-group input[type="text"]:disabled,
.form-group input[type="number"]:disabled,
.form-group input[type="date"]:disabled,
.form-group textarea:disabled {
  background: #f4f5f8;
  color: var(--text-secondary);
  cursor: default;
  border-color: #e8e9ee;
  opacity: 1;
  -webkit-text-fill-color: var(--text-secondary);
}

.btn-cancel {
  background: #fff;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-cancel:hover {
  background: var(--bg);
}

/* Group Card */
.group-section {
  margin-top: 16px;
}

.group-section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}

.group-section-header h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
}

.group-card {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-bottom: 12px;
  background: #fff;
  position: relative;
}

.group-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
  padding-bottom: 10px;
  border-bottom: 1px solid #f0f1f5;
}

.group-card-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
}

.group-card-remove {
  color: var(--danger);
  background: none;
  border: none;
  font-size: 12px;
  cursor: pointer;
  padding: 2px 8px;
  border-radius: var(--radius);
}
.group-card-remove:hover {
  background: var(--danger-light);
}

.group-card .form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.group-card .form-group {
  margin-bottom: 12px;
}

.group-card .form-group:last-child {
  margin-bottom: 0;
}

/* Image Upload */
.upload-area {
  border: 1px dashed var(--border);
  border-radius: var(--radius);
  padding: 20px;
  text-align: center;
  cursor: pointer;
  transition: all var(--transition);
  background: #fafbfd;
}

.upload-area:hover {
  border-color: var(--accent);
  background: var(--accent-light);
}

.upload-area .upload-icon {
  font-size: 24px;
  color: var(--text-muted);
  margin-bottom: 6px;
}

.upload-area .upload-text {
  font-size: 12px;
  color: var(--text-secondary);
}

.upload-area .upload-hint {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* Weight Summary */
.weight-summary {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  background: #f8f9fb;
  border-radius: var(--radius);
  margin-top: 12px;
  font-size: 12px;
  color: var(--text-secondary);
}

.weight-summary .weight-total {
  font-weight: 600;
  color: var(--text);
}

.weight-summary.error {
  background: var(--danger-light);
  color: var(--danger);
}

.weight-summary.error .weight-total {
  color: var(--danger);
}

/* Channel Selector */
.channel-default-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.channel-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.channel-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 11px;
  border: 1px solid var(--border);
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  background: #fff;
  color: var(--text-secondary);
  transition: all var(--transition);
  user-select: none;
}

.channel-chip:hover {
  border-color: var(--accent);
}

.channel-chip.selected {
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}

.channel-chip .chip-remove {
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1;
}

.channel-chip .chip-remove:hover {
  color: var(--danger);
}

.channel-add {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.channel-add input {
  flex: 1;
  height: 30px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 10px;
  font-size: 12px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  outline: none;
}

.channel-add input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

/* Page Title input */
.page-title-input {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  outline: none;
  transition: border-color var(--transition);
  box-sizing: border-box;
}

.page-title-input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.page-title-input:disabled {
  background: #f4f5f8;
  color: var(--text-secondary);
  cursor: default;
}

/* Background Image Section */
.bg-image-section {
  margin-bottom: 20px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: #f8f9fb;
}

.bg-image-section h4 {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
}

.bg-image-preview {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.bg-image-thumb {
  width: 100px;
  height: 60px;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  object-fit: cover;
  background: #fff;
}

.bg-image-info {
  flex: 1;
}

.bg-image-name {
  font-size: 13px;
  color: var(--text);
  margin-bottom: 4px;
}

.bg-image-hint {
  font-size: 11px;
  color: var(--text-muted);
}

.bg-image-actions {
  display: flex;
  gap: 6px;
}

.bg-image-btn {
  padding: 4px 10px;
  font-size: 12px;
  border-radius: var(--radius);
  cursor: pointer;
  border: 1px solid var(--border);
  background: #fff;

  const ca = a.channels || [];
  const cb = b.channels || [];
  return ca.some(c => cb.includes(c));

  (a.channels || []).forEach(c => { if (cb.includes(c)) labels.push(channelLabel(c)); });

function escapeHtml(str) {
  const div = document.createElement('div');

function renderPagination(total, page, pageSize) {
  const totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) return '';
  let html = `<span class="page-info">共 ${total} 条</span>`;
  html += `<button ${page === 1 ? 'disabled' : ''} onclick="goPage(${page - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button ${page === totalPages ? 'disabled' : ''} onclick="goPage(${page + 1})">›</button>`;
  return html;
}

let currentPage = 1;
const pageSize = 10;

function refreshTable() {
  const search = document.getElementById('searchInput')?.value || '';
  const status = document.getElementById('statusFilter')?.value || '';
  let data = experiments;
  if (search) {
    const q = search.toLowerCase();
    data = data.filter(d => d.name.toLowerCase().includes(q));
  }
  if (status) {
    const s = status === 'true';
    data = data.filter(d => d.status === s);
  }
  const total = data.length;
  const start = (currentPage - 1) * pageSize;
  const paged = data.slice(start, start + pageSize);
  renderTable(paged);
  document.getElementById('pagination').innerHTML = renderPagination(total, currentPage, pageSize);
}

function goPage(page) { currentPage = page; refreshTable(); }
function filterData() { currentPage = 1; refreshTable(); }
function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('statusFilter').value = '';
  currentPage = 1;
  refreshTable();
}

// ===== 抽屉 =====
function openDrawer(mode, id) {
  drawerMode = mode;
  editingId = (mode === 'new') ? null : id;

  const titleMap = { new: '新建', edit: '编辑实验', view: '实验详情' };
  document.getElementById('editTitle').textContent = titleMap[mode];

  const isView = (mode === 'view');
  document.getElementById('btnSave').style.display = isView ? 'none' : '';

  let exp = null;
  if (id && mode !== 'new') {
    exp = experiments.find(e => e.id === id);
  }

  renderDrawerForm(exp, isView);

  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('editDrawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('editDrawer').classList.remove('open');

}

function addGroup() {
  const container = document.getElementById('groupsContainer');
  const cards = container.querySelectorAll('.group-card');
  const nextLetter = String.fromCharCode(65 + cards.length); // A=65
  const newCard = document.createElement('div');
  newCard.innerHTML = renderGroupCard({ groupName: nextLetter, weight: 0, content: { pageTitle: '', images: [] } }, cards.length, false);
  container.appendChild(newCard.firstElementChild);
  updateWeightSummary();
  updateSingleGroupWeight();
  // 自动滚动到底部
  setTimeout(() => {
    const drawerBody = document.querySelector('.drawer-body');
    drawerBody.scrollTo({ top: drawerBody.scrollHeight, behavior: 'smooth' });
  }, 50);
}

function updateSingleGroupWeight() {
  const container = document.getElementById('groupsContainer');
  if (!container) return;
  const cards = container.querySelectorAll('.group-card');
  const weightInputs = container.querySelectorAll('.group-weight');
  if (cards.length === 1) {
    weightInputs[0].value = 100;
    weightInputs[0].disabled = true;
    updateWeightSummary();
  } else {
    weightInputs.forEach(input => {
      input.disabled = false;
    });
  }
}

function removeGroup(index) {
  const container = document.getElementById('groupsContainer');
  const cards = container.querySelectorAll('.group-card');
  if (cards.length <= 1) {
    showToast('至少需要保留1个组别');
    return;
  }
  cards[index].remove();
  // Re-index
  container.querySelectorAll('.group-card').forEach((card, i) => {
    card.dataset.index = i;
    const removeBtn = card.querySelector('.group-card-remove');
    if (removeBtn) removeBtn.setAttribute('onclick', `removeGroup(${i})`);
  });
  updateWeightSummary();
  updateSingleGroupWeight();
}

function updateGroupTitle(input, index) {
  const card = input.closest('.group-card');
  const title = card.querySelector('.group-card-title');
  title.textContent = '组别 ' + input.value;
}

function updateWeightSummary() {
  const container = document.getElementById('groupsContainer');
  if (!container) return;
  const weights = container.querySelectorAll('.group-weight');
  let total = 0;
  weights.forEach(w => { total += parseInt(w.value) || 0; });
  const summary = document.getElementById('weightSummary');
  if (!summary) return;
  const isError = total !== 100;
  summary.className = 'weight-summary' + (isError ? ' error' : '');
  summary.innerHTML = `当前权重合计：<span class="weight-total">${total}%</span>${isError ? '（权重之和需等于100%）' : ' ✓'}`;
}

// ===== 渠道选择器 =====
function renderChannelInner(isView) {
  let chips = presetChannels.map(o => {
    const sel = editingChannels.includes(o.value);
    if (isView && !sel) return '';
    const click = isView ? '' : `onclick="toggleChannel('${o.value}')"`;
    return `<span class="channel-chip ${sel ? 'selected' : ''}" ${click}>${escapeHtml(o.label)}</span>`;
  }).join('');

  const chipsHtml = `<div class="channel-chips">${chips || '<span style="color:var(--text-muted);font-size:12px">' + (isView ? '—' : '请选择渠道') + '</span>'}</div>`;

  return chipsHtml;
}

function refreshChannelArea() {
  const area = document.getElementById('channelArea');
  if (area) area.innerHTML = renderChannelInner(editingIsView);
}

function toggleChannel(value) {
  const i = editingChannels.indexOf(value);
  if (i >= 0) editingChannels.splice(i, 1);
  else editingChannels.push(value);
  refreshChannelArea();
}


// ===== 图片处理函数 =====
function updatePageTitle(groupIndex, title) {
  const card = document.querySelectorAll('.group-card')[groupIndex];
  if (!card) return;
  
  const jsonTextarea = card.querySelector('.group-content-json');
  try {
    const content = JSON.parse(jsonTextarea.value || '{}');
    content.pageTitle = title;
    jsonTextarea.value = JSON.stringify(content, null, 2);
  } catch (e) {
    console.error('更新页面标题失败:', e);
  }
}

function handleDragOver(e, groupIndex) {
  e.preventDefault();
  e.stopPropagation();
  const uploadArea = e.target.closest('.images-upload-area');
  if (uploadArea) {
    uploadArea.classList.add('drag-over');
  }
}

function handleDragLeave(e, groupIndex) {
  e.preventDefault();
  e.stopPropagation();
  const uploadArea = e.target.closest('.images-upload-area');
  if (uploadArea) {
    uploadArea.classList.remove('drag-over');
  }
}

function handleDrop(e, groupIndex) {
  e.preventDefault();
  e.stopPropagation();
  
  const uploadArea = e.target.closest('.images-upload-area');
  if (uploadArea) {
    uploadArea.classList.remove('drag-over');
  }
  
  const files = e.dataTransfer.files;
  processFiles(files, groupIndex);
}

function handleFiles(e, groupIndex) {
  const files = e.target.files;
  processFiles(files, groupIndex);
}

function processFiles(files, groupIndex) {
  console.log('processFiles called', files.length, 'files for group', groupIndex);
  
  const card = document.querySelectorAll('.group-card')[groupIndex];
  if (!card) {
    console.error('Card not found for group', groupIndex);
    return;
  }
  
  const jsonTextarea = card.querySelector('.group-content-json');
  let content = {};
  try {
    content = JSON.parse(jsonTextarea.value || '{}');
  } catch (e) {
    console.error('JSON parse error:', e);
    content = { pageTitle: '', images: [] };
  }
  
  if (!content.images) content.images = [];
  
  // 检查图片数量限制
  const existingCount = content.images.length;
  if (existingCount + files.length > 10) {
    showToast(`最多只能上传10张图片，当前已有${existingCount}张`);
    return;
  }
  
  if (files.length === 0) {
    showToast('请选择图片文件');
    return;
  }
  
  // 处理每个文件
  for (let i = 0; i < files.length; i++) {
    const file = files[i];
    console.log('Processing file:', file.name, file.type, file.size);
    
    // 检查文件类型
    if (!file.type.startsWith('image/')) {
      showToast(`文件"${file.name}"不是图片类型，已跳过`);
      continue;
    }
    
    // 检查文件大小（5MB限制）
    if (file.size > 5 * 1024 * 1024) {
      showToast(`文件"${file.name}"超过5MB限制，已跳过`);
      continue;
    }
    
    // 创建文件预览（在实际应用中，这里应该是上传到服务器并返回URL）
    const reader = new FileReader();
    reader.onload = function(e) {
      const imageDataUrl = e.target.result;
      console.log('File loaded successfully');
      
      content.images.push({
        url: imageDataUrl, // 实际应用中这里应该是服务器返回的URL
        name: file.name.replace(/\.[^/.]+$/, ""), // 去除扩展名
        order: content.images.length
      });
      
      // 更新JSON
      jsonTextarea.value = JSON.stringify(content, null, 2);
      
      // 重新渲染这个分组卡片
      const groups = getCurrentGroupsFromDrawer();
      if (groups && groups[groupIndex]) {
        const container = document.getElementById('groupsContainer');
        const newCard = document.createElement('div');
        newCard.innerHTML = renderGroupCard(groups[groupIndex], groupIndex, false);
        
        // 替换原有卡片
        const oldCard = container.querySelectorAll('.group-card')[groupIndex];
        if (oldCard) {
          oldCard.parentNode.replaceChild(newCard.firstElementChild, oldCard);
        }
        
        showToast(`已上传 ${i + 1}/${files.length} 张图片`);
      }
    };
    
    reader.onerror = function(e) {
      console.error('FileReader error:', e);
      showToast(`文件"${file.name}"读取失败`);
    };
    
    reader.readAsDataURL(file);
  }
  
  // 重置文件输入
  const fileInput = document.getElementById(`fileInput-${groupIndex}`);
  if (fileInput) {
    fileInput.value = '';
  }
}

// 拖拽排序相关变量
let dragSourceIndex = null;
let dragSourceGroupIndex = null;
let dragOverElement = null;

// 拖拽开始
function handleDragStart(e, groupIndex, imageIndex) {
  dragSourceIndex = imageIndex;
  dragSourceGroupIndex = groupIndex;
  e.dataTransfer.setData('text/plain', `${groupIndex},${imageIndex}`);
  e.dataTransfer.effectAllowed = 'move';
  
  // 添加拖动样式
  setTimeout(() => {
    e.target.classList.add('dragging');
  }, 0);
}

// 拖拽经过
function handleDragOver(e, groupIndex, imageIndex) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  
  const target = e.target.closest('.image-item');
  if (target && target !== dragOverElement) {
    if (dragOverElement) {
      dragOverElement.classList.remove('drag-overlay');
    }
    dragOverElement = target;
    dragOverElement.classList.add('drag-overlay');
  }
}

// 拖拽放置
function handleDrop(e, groupIndex, imageIndex) {
  e.preventDefault();
  
  if (dragSourceGroupIndex !== groupIndex) {
    // 只允许同组内拖拽
    if (dragOverElement) {
      dragOverElement.classList.remove('drag-overlay');
      dragOverElement = null;
    }
    return;
  }
  
  const targetIndex = parseInt(e.target.closest('.image-item').dataset.index);
  
  if (dragSourceIndex !== null && dragSourceIndex !== targetIndex) {
    moveImageByDrag(groupIndex, dragSourceIndex, targetIndex);
  }
  
  if (dragOverElement) {
    dragOverElement.classList.remove('drag-overlay');
    dragOverElement = null;
  }
}

// 拖拽结束
function handleDragEnd(e, groupIndex, imageIndex) {
  e.target.classList.remove('dragging');
  
  if (dragOverElement) {
    dragOverElement.classList.remove('drag-overlay');
    dragOverElement = null;
  }
  
  dragSourceIndex = null;
  dragSourceGroupIndex = null;
}

// 通过拖拽移动图片
function moveImageByDrag(groupIndex, fromIndex, toIndex) {
  const card = document.querySelectorAll('.group-card')[groupIndex];
  if (!card) return;
  
  const jsonTextarea = card.querySelector('.group-content-json');
  try {
    const content = JSON.parse(jsonTextarea.value || '{}');
    if (!content.images || !content.images[fromIndex]) return;
    
    // 移动元素
    const [movedItem] = content.images.splice(fromIndex, 1);
    content.images.splice(toIndex, 0, movedItem);
    
    // 重新排序
    content.images.forEach((img, idx) => {
      img.order = idx;
    });
    
    jsonTextarea.value = JSON.stringify(content, null, 2);
    
    // 重新渲染这个分组卡片
    const groups = getCurrentGroupsFromDrawer();
    if (groups && groups[groupIndex]) {
      const container = document.getElementById('groupsContainer');
      const newCard = document.createElement('div');
      newCard.innerHTML = renderGroupCard(groups[groupIndex], groupIndex, false);
      
      // 替换原有卡片
      const oldCard = container.querySelectorAll('.group-card')[groupIndex];
      if (oldCard) {
        oldCard.parentNode.replaceChild(newCard.firstElementChild, oldCard);
      }
    }
  } catch (e) {
    console.error('拖拽排序失败:', e);
  }
}

// 确认删除图片
function confirmRemoveImage(groupIndex, imageIndex) {
  const card = document.querySelectorAll('.group-card')[groupIndex];
  if (!card) return;
  
  const jsonTextarea = card.querySelector('.group-content-json');
  try {
    const content = JSON.parse(jsonTextarea.value || '{}');
    if (!content.images || !content.images[imageIndex]) return;
    
    const imgName = content.images[imageIndex].name || '图片';
    
    // 创建确认对话框
    if (confirm(`确定要删除图片 "${imgName}" 吗？`)) {
      removeImage(groupIndex, imageIndex);
    }
  } catch (e) {
    console.error('获取图片信息失败:', e);
  }
}

function removeImage(groupIndex, imageIndex) {
  const card = document.querySelectorAll('.group-card')[groupIndex];
  if (!card) return;
  
  const jsonTextarea = card.querySelector('.group-content-json');
  try {
    const content = JSON.parse(jsonTextarea.value || '{}');
    if (content.images && content.images[imageIndex]) {
      content.images.splice(imageIndex, 1);
      
      // 重新排序
      content.images.forEach((img, idx) => {
        img.order = idx;
      });
      
      jsonTextarea.value = JSON.stringify(content, null, 2);
      
      // 重新渲染这个分组卡片
      const groups = getCurrentGroupsFromDrawer();
      if (groups && groups[groupIndex]) {
        const container = document.getElementById('groupsContainer');
        const newCard = document.createElement('div');
        newCard.innerHTML = renderGroupCard(groups[groupIndex], groupIndex, false);
        
        // 替换原有卡片
        const oldCard = container.querySelectorAll('.group-card')[groupIndex];
        if (oldCard) {
          oldCard.parentNode.replaceChild(newCard.firstElementChild, oldCard);
        }
      }
    }
  } catch (e) {
    console.error('删除图片失败:', e);
  }
}



// ===== 背景图处理函数 =====
function handleBackgroundFile(e, groupIndex) {
  const files = e.target.files;
  if (files.length === 0) return;
  
  // 只取第一张图片
  const file = files[0];
  
  // 检查文件类型
  if (!file.type.startsWith('image/')) {
    showToast(`文件"${file.name}"不是图片类型`);
    return;
  }
  
  // 检查文件大小（10MB限制，背景图可以稍大）
  if (file.size > 10 * 1024 * 1024) {
    showToast(`背景图"${file.name}"超过10MB限制`);
    return;
  }
  
  const card = document.querySelectorAll('.group-card')[groupIndex];
  if (!card) return;
  
  const jsonTextarea = card.querySelector('.group-content-json');
  let content = {};
  try {
    content = JSON.parse(jsonTextarea.value || '{}');
  } catch (e) {
    content = { pageTitle: '', images: [] };
  }
  
  // 创建文件预览
  const reader = new FileReader();
  reader.onload = function(e) {
    const imageDataUrl = e.target.result;
    
    // 更新背景图
    content.backgroundImage = imageDataUrl;
    content.backgroundImageName = file.name.replace(/\.[^/.]+$/, ""); // 去除扩展名
    
    // 更新JSON
    jsonTextarea.value = JSON.stringify(content, null, 2);
    
    // 重新渲染这个分组卡片
    const groups = getCurrentGroupsFromDrawer();
    if (groups && groups[groupIndex]) {
      const container = document.getElementById('groupsContainer');
      const newCard = document.createElement('div');
      newCard.innerHTML = renderGroupCard(groups[groupIndex], groupIndex, false);
      
      // 替换原有卡片
      const oldCard = container.querySelectorAll('.group-card')[groupIndex];
      if (oldCard) {
        oldCard.parentNode.replaceChild(newCard.firstElementChild, oldCard);
      }
    }
    
    showToast('背景图上传成功');
  };
  
  reader.readAsDataURL(file);
  
  // 重置文件输入
  e.target.value = '';
}

function replaceBackgroundImage(groupIndex) {
  // 创建临时的文件输入元素
  const tempFileInput = document.createElement('input');
  tempFileInput.type = 'file';
  tempFileInput.accept = 'image/*';
  tempFileInput.style.display = 'none';
  
  tempFileInput.onchange = function(e) {
    handleBackgroundFile(e, groupIndex);
    // 清理临时元素
    document.body.removeChild(tempFileInput);
  };
  
  // 添加到DOM并触发点击
  document.body.appendChild(tempFileInput);
  tempFileInput.click();
}

function removeBackgroundImage(groupIndex) {
  const card = document.querySelectorAll('.group-card')[groupIndex];
  if (!card) return;
  
  const jsonTextarea = card.querySelector('.group-content-json');
  try {
    const content = JSON.parse(jsonTextarea.value || '{}');
    
    if (confirm('确定要删除背景图吗？删除后将使用默认背景。')) {
      delete content.backgroundImage;
      delete content.backgroundImageName;
      
      // 更新JSON
      jsonTextarea.value = JSON.stringify(content, null, 2);
      
      // 重新渲染这个分组卡片
      const groups = getCurrentGroupsFromDrawer();
      if (groups && groups[groupIndex]) {
        const container = document.getElementById('groupsContainer');
        const newCard = document.createElement('div');
        newCard.innerHTML = renderGroupCard(groups[groupIndex], groupIndex, false);
        
        // 替换原有卡片
        const oldCard = container.querySelectorAll('.group-card')[groupIndex];
        if (oldCard) {
          oldCard.parentNode.replaceChild(newCard.firstElementChild, oldCard);
        }
      }
      
      showToast('背景图已删除');
    }
  } catch (e) {
    console.error('删除背景图失败:', e);
  }
}

function getCurrentGroupsFromDrawer() {
  const container = document.getElementById('groupsContainer');
  if (!container) return null;
  
  const cards = container.querySelectorAll('.group-card');
  const groups = [];
  
  cards.forEach(card => {
    const gName = card.querySelector('.group-name').value.trim();
    const gWeight = parseInt(card.querySelector('.group-weight').value) || 0;
    const contentRaw = card.querySelector('.group-content-json').value.trim();
    
    try {
      const content = JSON.parse(contentRaw || '{}');
      groups.push({ groupName: gName, weight: gWeight, content });
    } catch (e) {
      groups.push({ groupName: gName, weight: gWeight, content: {} });
    }
  });
  
  return groups;
}

// ===== 保存 =====
function saveExperiment() {
  const name = document.getElementById('expName').value.trim();
  const url = document.getElementById('expUrl').value.trim();
  const status = document.getElementById('expStatus').checked;

  if (!name) { showToast('请输入实验名称'); return; }
  if (!url) { showToast('请输入落地页URL'); return; }
  if (editingChannels.length === 0) { showToast('请至少选择一个适用渠道'); return; }

  const container = document.getElementById('groupsContainer');
  const cards = container.querySelectorAll('.group-card');
  const groups = [];
  let weightTotal = 0;
  let valid = true;
  let errorMsg = '';

  cards.forEach((card, i) => {
    const gName = card.querySelector('.group-name').value.trim();
    const gWeight = parseInt(card.querySelector('.group-weight').value) || 0;
    const contentRaw = card.querySelector('.group-content-json').value.trim();
    const label = `第${i + 1}组${gName ? '（' + gName + '）' : ''}`;

    if (!gName || !gWeight) valid = false;

    let content = {};
    if (!contentRaw) {
      if (!errorMsg) errorMsg = `${label}的页面内容配置不能为空`;
    } else {
      try {
        content = JSON.parse(contentRaw);
      } catch (e) {
        if (!errorMsg) errorMsg = `${label}的页面内容 JSON 格式不正确`;
      }
    }
    
    // 验证必要的字段
    if (!content.pageTitle || content.pageTitle.trim() === '') {
      if (!errorMsg) errorMsg = `${label}的页面标题不能为空`;
    }
    
    // 验证图片数量
    if (!content.images || content.images.length === 0) {
      if (!errorMsg) errorMsg = `${label}至少需要上传1张图片`;
    } else if (content.images.length > 10) {
      if (!errorMsg) errorMsg = `${label}最多只能上传10张图片`;
    }

    weightTotal += gWeight;
    groups.push({ groupName: gName, weight: gWeight, content });
  });

  if (!valid) { showToast('请完整填写所有组别的标识与权重'); return; }
  if (errorMsg) { showToast(errorMsg); return; }
  if (weightTotal !== 100) { showToast('权重之和必须等于100%'); return; }

  const now = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');

  const channels = [...editingChannels];

  if (editingId) {
    const exp = experiments.find(e => e.id === editingId);
    if (exp) {
      exp.name = name;
      exp.url = url;
      exp.status = status;
      exp.groups = groups;
      exp.channels = channels;
    }
  } else {
    experiments.unshift({
      id: nextId++,
      name,
      url,
      status,
      channels,
      groups,
      createTime: now,
      creator: '当前用户'
    });
  }

  showToast('保存成功', 'success');
  closeDrawer();
  refreshTable();
}

// ===== Switch切换 =====

function toggleStatus(id, event) {
  event.stopPropagation();
  event.preventDefault();
  const item = experiments.find(e => e.id === id);
  if (!item) return;

  // 禁用操作直接执行
  if (item.status) {
    item.status = false;
    refreshTable();
    showToast('已禁用', 'success');
    return;
  }

  // 启用操作：检查同URL、渠道有交集是否有其他启用中的实验
  const conflicts = experiments.filter(e => e.id !== id && e.url === item.url && e.status === true && channelsOverlap(e, item));
  if (conflicts.length > 0) {
    // 方案2：阻止启用，指出具体被占用的渠道及占用实验
    const lines = conflicts.map(e => {
      const ch = getOverlapChannelLabels(e, item).map(l => '<b>' + l + '</b>').join('、');
      return `· ${ch} —— 已被「${escapeHtml(e.name)}」占用`;
    }).join('<br>');
    document.getElementById('conflictMsg').innerHTML = `该落地页URL下，以下渠道已被其他启用中的实验占用，无法启用：<br><br>${lines}<br><br>请先从占用实验中移除对应渠道，或先禁用占用实验，再启用当前实验。`;
    document.getElementById('conflictModal').style.display = 'flex';
  } else {
    item.status = true;
    refreshTable();
    showToast('已启用', 'success');
  }
}

function closeConflictModal() {
  document.getElementById('conflictModal').style.display = 'none';
}

function toggleDrawerStatus(e) {
  e.stopPropagation();
  const cb = document.getElementById('expStatus');
  if (cb.disabled) return;
  cb.checked = !cb.checked;
  document.getElementById('drawerStatusLabel').textContent = cb.checked ? '启用' : '禁用';
}

// ===== 删除 =====
function openDeleteModal(id) {
  currentDeleteId = id;
  document.getElementById('deleteModal').style.display = 'flex';
}

function closeModal() {
  currentDeleteId = null;
  document.getElementById('deleteModal').style.display = 'none';
}

function confirmDelete() {
  if (currentDeleteId !== null) {
    experiments = experiments.filter(e => e.id !== currentDeleteId);
    currentDeleteId = null;
    document.getElementById('deleteModal').style.display = 'none';
    refreshTable();
    showToast('实验已删除');
  }
}

// ===== Toast =====
function showToast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ===== 初始化 =====
refreshTable();
</script>
