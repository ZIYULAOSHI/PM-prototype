<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化王管理后台 - 推送管理 (V1)</title>
<style>
:root {
  --bg: #f4f5f8;
  --surface: #fafbfd;
  --sidebar-bg: #1a1d24;
  --sidebar-text: #9ba3b4;
  --sidebar-active: #e8edf5;
  --sidebar-active-bg: rgba(74, 108, 247, 0.1);
  --text: #1e2130;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: #e5e7ed;
  --accent: #3b6df0;
  --primary: #3b6df0;
  --accent-light: #e8edf9;
  --danger: #e5484d;
  --danger-light: #fef2f2;
  --success: #30a46c;
  --success-light: #eef9f2;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Sidebar */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  user-select: none;
}

.sidebar-logo {
  padding: 20px 18px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.sidebar-logo h1 {
  font-size: 16px;
  font-weight: 700;
  color: #e8edf5;
  letter-spacing: .5px;
}

.sidebar-logo span {
  font-size: 11px;
  color: var(--sidebar-text);
  display: block;
  margin-top: 2px;
  font-weight: 400;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.nav-section { margin-bottom: 4px; }

.nav-item {
  display: flex;
  align-items: center;
  padding: 9px 18px;
  color: var(--sidebar-text);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 13px;
  gap: 10px;
  border-left: 2px solid transparent;
  text-decoration: none;
}

.nav-item:hover {
  color: #c8cedb;
  background: rgba(255,255,255,0.03);
}

.nav-item.active {
  color: #c8d4f7;
  background: rgba(59, 109, 240, 0.12);
  border-left-color: var(--accent);
  font-weight: 600;
}

.nav-item .icon {
  width: 18px;
  height: 18px;
  opacity: 0.6;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-item.active .icon { opacity: 0.9; }

.nav-group-header {
  display: flex;
  align-items: center;
  padding: 9px 18px;
  color: var(--sidebar-text);
  cursor: pointer;
  font-size: 13px;
  gap: 10px;
  transition: all var(--transition);
}

.nav-group-header:hover {
  color: #c8cedb;
  background: rgba(255,255,255,0.03);
}

.nav-group-header .arrow {
  margin-left: auto;
  font-size: 10px;
  transition: transform var(--transition);
}

.nav-group.open .nav-group-header .arrow {
  transform: rotate(90deg);
}

.nav-sub {
  overflow: hidden;
  max-height: 0;
  transition: max-height 250ms ease;
}

.nav-group.open .nav-sub {
  max-height: 200px;
}

.nav-sub .nav-item {
  padding-left: 46px;
  font-size: 12.5px;
}

/* Main Area */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-bar {
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  flex-shrink: 0;
}

.breadcrumb {
  font-size: 13px;
  color: var(--text-secondary);
}

.breadcrumb span {
  color: var(--text-muted);
  margin: 0 6px;
}

.breadcrumb .current {
  color: var(--text);
  font-weight: 600;
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

/* Page Header */
.page-header {
  margin-bottom: 18px;
}

.page-header h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

/* Filter Bar */
.filter-bar {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.filter-bar input[type="text"],
.filter-bar select {
  height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 10px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  transition: border-color var(--transition);
  outline: none;
}

.filter-bar input[type="text"]:focus,
.filter-bar select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.filter-bar input[type="text"] { width: 220px; }
.filter-bar select { width: 130px; }
.filter-bar input::placeholder { color: var(--text-muted); }

.btn {
  height: 34px;
  padding: 0 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  font-weight: 500;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #2f5cd6; }

.btn-default {
  background: #fff;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-default:hover { background: var(--bg); border-color: #cdd2db; }

.btn-new { margin-left: auto; }

.btn-danger-text {
  color: var(--danger);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius);
}
.btn-danger-text:hover { background: var(--danger-light); }

.btn-edit-text {
  color: var(--accent);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius);
  margin-right: 2px;
}
.btn-edit-text:hover { background: var(--accent-light); }

.btn-send {
  color: var(--success);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--radius);
  margin-right: 2px;
}
.btn-send:hover { background: var(--success-light); }

/* Table */
.table-container {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
  overflow-y: hidden;
}

table {
  width: 100%;
  min-width: max-content;
  border-collapse: separate;
  border-spacing: 0;
}

thead th {
  background: #f8f9fb;
  padding: 11px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}

thead th.col-actions {
  position: sticky;
  right: 0;
  z-index: 2;
  background: #f8f9fb;
  box-shadow: -4px 0 8px -4px rgba(0,0,0,0.08);
}

tbody td {
  padding: 12px 14px;
  font-size: 13px;
  border-bottom: 1px solid #f0f1f5;
  color: var(--text);
  vertical-align: middle;
  background: var(--surface);
}

tbody td.col-actions {
  position: sticky;
  right: 0;
  background: var(--surface);
  z-index: 1;
  box-shadow: -4px 0 8px -4px rgba(0,0,0,0.08);
}

tbody tr:hover td { background: #fafbfd; }
tbody tr:hover td.col-actions { background: #fafbfd; }

tbody tr:last-child td { border-bottom: none; }

.td-ellipsis {
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Status Badge */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
}

.status-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.status-badge.running { color: var(--success); }
.status-badge.running::before { background: var(--success); }
.status-badge.paused { color: var(--warning); }
.status-badge.paused::before { background: var(--warning); }

/* Copy ID Button */
.copy-id-btn {
  cursor: pointer;
  color: var(--accent);
  margin-left: 6px;
  vertical-align: middle;
  display: inline-flex;
  align-items: center;
  opacity: 0.6;
  transition: opacity 0.15s;
}
.copy-id-btn:hover { opacity: 1; }
.copy-id-btn:active { opacity: 0.4; }

/* Toggle Switch */
.toggle-switch {
  position: relative;
  display: inline-block;
  width: 36px;
  height: 20px;
  vertical-align: middle;
}
.toggle-switch input { display: none; }
.toggle-slider {
  position: absolute;
  inset: 0;
  background: #d1d5db;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  left: 2px;
  top: 2px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
}
.toggle-switch input:checked + .toggle-slider { background: var(--accent); }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); }
/* 只读/禁用状态：明确不可点击 */
.toggle-switch input:disabled + .toggle-slider { cursor: not-allowed; opacity: 0.45; }
.toggle-switch.is-readonly { cursor: not-allowed; }
.status-badge.draft { color: var(--text-muted); }
.status-badge.draft::before { background: var(--text-muted); }
.status-badge.sent { color: var(--accent); }
.status-badge.sent::before { background: var(--accent); }
.status-badge.pending { color: #7c5cff; }
.status-badge.pending::before { background: #7c5cff; }

/* Tags */
.tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
}

.tag-blue { background: #eef2ff; color: #4f46e5; }
.tag-green { background: #ecfdf5; color: #047857; }
.tag-orange { background: #fef3c7; color: #b45309; }

.type-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}

.type-tag.manual { background: #eef2ff; color: #4f46e5; }
.type-tag.auto { background: #fdf2f8; color: #be185d; }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 14px 20px;
  gap: 6px;
  border-top: 1px solid #f0f1f5;
}

.pagination .page-info {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-right: 10px;
}

.pagination button {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: all var(--transition);
  font-family: var(--font);
}

.pagination button:hover { border-color: var(--accent); color: var(--accent); }
.pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  cursor: pointer;
}

.switch input { opacity: 0; width: 0; height: 0; }

.switch .slider {
  position: absolute;
  inset: 0;
  background: #d1d5db;
  border-radius: 22px;
  transition: all 200ms ease;
}

.switch .slider::before {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  left: 2px;
  bottom: 2px;
  background: #fff;
  border-radius: 50%;
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 1px 2px rgba(0,0,0,0.12);
}

.switch input:checked + .slider { background: var(--success); }
.switch input:checked + .slider::before { transform: translateX(18px); }

/* Drawer */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 200ms ease, visibility 200ms ease;
}

.drawer-overlay.open { opacity: 1; visibility: visible; }

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: 560px;
  height: 100vh;
  background: var(--surface);
  box-shadow: -4px 0 20px rgba(0, 0, 0, 0.12);
  z-index: 1000;
  transform: translateX(100%);
  transition: transform 250ms cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.drawer.open { transform: translateX(0); }

.drawer-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.drawer-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.drawer-footer {
  padding: 20px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

/* Form */
.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-group label .required {
  color: var(--danger);
  font-size: 14px;
  line-height: 1;
}

.form-group .hint {
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 4px;
}

.form-group select,
.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="datetime-local"],
.form-group textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  outline: none;
  transition: border-color var(--transition);
}

.form-group select:focus,
.form-group input[type="text"]:focus,
.form-group input[type="number"]:focus,
.form-group input[type="datetime-local"]:focus,
.form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.input-error {
  border-color: var(--danger) !important;
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1) !important;
}

.form-group textarea {
  min-height: 80px;
  resize: vertical;
  line-height: 1.6;
}

.char-counter { font-size: 11px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
.char-counter.warn { color: #d97706; }
.char-counter.over { color: #dc2626; }

.form-group select:disabled,
.form-group input:disabled,
.form-group textarea:disabled {
  background: #f4f5f8;
  color: var(--text-secondary);
  cursor: default;
  border-color: #e8e9ee;
  opacity: 1;
  -webkit-text-fill-color: var(--text-secondary);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

/* Conditional section */
.conditional-section {
  background: #f8f9fb;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-top: 8px;
}

.conditional-section h5 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* Tag Selector */
.tag-selector {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  background: #fff;
  color: var(--text-secondary);
  transition: all var(--transition);
  user-select: none;
}

.tag-chip:hover { border-color: var(--accent); }

.tag-chip.selected {
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}

/* Switch Row */
.switch-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ===== 目标人群分组下拉多选 ===== */
.audience-dropdown { position: relative; }
.audience-dropdown-trigger {
  display: flex; align-items: center; justify-content: space-between;
  min-height: 40px; padding: 4px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: #fff; cursor: pointer; gap: 8px;
  transition: border-color var(--transition);
}
.audience-dropdown-trigger:hover { border-color: var(--accent); }
.audience-dropdown-trigger:focus-within,
.audience-dropdown.open > .audience-dropdown-trigger { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
.audience-dropdown-chips {
  display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0;
}
.audience-dropdown-chips .placeholder {
  color: var(--text-muted); font-size: 13px; padding: 4px 0;
}
.audience-dropdown-arrow {
  font-size: 11px; color: var(--text-muted); flex-shrink: 0;
  transition: transform 0.2s;
}
.audience-dropdown.open > .audience-dropdown-trigger .audience-dropdown-arrow {
  transform: rotate(180deg);
}
.audience-dropdown-panel {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  max-height: 320px; overflow-y: auto;
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1); z-index: 100; padding: 8px 0;
}
.audience-dropdown.open > .audience-dropdown-panel { display: block; }
.audience-dropdown-group-label {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  padding: 6px 14px 4px; text-transform: none;
}
.audience-dropdown-option {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px; font-size: 13px; color: var(--text-primary);
  cursor: pointer; transition: background 0.15s;
}
.audience-dropdown-option:hover { background: #f3f4f6; }
.audience-dropdown-option input[type="checkbox"] {
  width: 15px; height: 15px; margin: 0; flex-shrink: 0;
  accent-color: var(--accent); cursor: pointer;
}
.audience-dropdown-option input[type="checkbox"]:indeterminate {
  accent-color: var(--accent);
}
.audience-dropdown-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 12px;
  background: var(--accent-light); color: var(--accent);
  font-size: 12px; font-weight: 500;
}
.audience-dropdown-chip .remove {
  cursor: pointer; font-size: 14px; line-height: 1; opacity: 0.6;
}
.audience-dropdown-chip .remove:hover { opacity: 1; }

/* ===== 目标人群条件构造器 ===== */
.aud-builder { border:1px solid var(--border); border-radius:10px; padding:12px; background:#fafbfc; }
.aud-builder-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.aud-builder-hint { font-size:12px; color:var(--text-muted); }
.aud-preset-select { height:30px; border:1px solid var(--border); border-radius:6px; font-size:12px; padding:0 8px; background:#fff; color:var(--text-primary); cursor:pointer; }
.aud-group { border:1px dashed var(--border); border-radius:8px; padding:10px 10px 10px 12px; background:#fff; }
.aud-group.nested { background:#f6f8fc; border-color:#c7d2fe; margin:6px 0; }
.aud-group-bar { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.aud-logic-seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.aud-logic-seg button { border:none; background:#fff; font-size:12px; padding:4px 10px; cursor:pointer; color:var(--text-secondary); }
.aud-logic-seg button.active { background:var(--accent); color:#fff; }
.aud-logic-label { font-size:12px; color:var(--text-muted); }
.aud-cond { display:flex; align-items:center; gap:6px; margin:6px 0; flex-wrap:wrap; }
.aud-cond select, .aud-cond input { height:32px; border:1px solid var(--border); border-radius:6px; font-size:13px; padding:0 8px; background:#fff; color:var(--text-primary); }

function getChannelLabel(val) {
  const m = { push: 'Push推送', inapp: '站内信' };
  return m[val] || val;
}

function getChannelTag(val) {
  const m = { push: 'tag-blue', inapp: 'tag-green' };
  return m[val] || '';
}

function getAudienceLabel(val) {
  const found = audienceTags.find(t => t.value === val);
  return found ? found.label.split('（')[0] : val;
}

function getAudienceShortLabel(val) {
  const found = audienceTags.find(t => t.value === val);
  if (!found) return val;
  // 取括号前部分，若无括号则截取前6字
  const base = found.label.split('（')[0].split('(')[0];
  return base.length > 6 ? base.slice(0, 6) + '…' : base;
}

function getPriorityLabel(p, type) {
  if (p === null || p === undefined || p === '') return '<span style="color:var(--text-muted);font-size:12px">--</span>';
  const num = Number(p);
  let color = 'var(--text-secondary)';
  if (num <= 10) color = '#ef4444';
  else if (num <= 30) color = '#f59e0b';
  else if (num <= 70) color = 'var(--text-secondary)';
  else color = 'var(--text-muted)';
  return `<span style="font-size:12px;color:${color};font-weight:500">${p}</span>`;
}

  tbody.innerHTML = data.map((item, idx) => {
    const typeLabel = item.type === 'auto'

    const channelHtml = (item.channels || []).map(c =>
      `<span class="tag ${getChannelTag(c)}">${getChannelLabel(c)}</span>`

    const totalAudienceTags = audienceTags.length;
    let audienceHtml;
    if (item.audienceSummary !== undefined && item.audienceSummary !== '') {
      const summary = item.audienceSummary || '全部用户';
      const tags = item.audience || [];
      let chips = [];
      if (tags.length === totalAudienceTags && tags.length > 0) chips.push('全部用户');
      else chips = tags.map(a => getAudienceShortLabel(a));
      if (chips.length === 0) chips.push('全部用户');
      audienceHtml = chips.map(c => `<span class="rule-tag active" title="${escapeHtml(summary)}">${c}</span>`).join(' ');
    } else if ((item.audience || []).length === totalAudienceTags) {
      audienceHtml = '<span class="rule-tag active">全部用户</span>';
    } else {

    }

    const statusMap = {
      draft: '<span class="status-badge draft">草稿</span>',

      running: '<span class="status-badge running">运行中</span>',

      } else {

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderPagination(total, page, pageSize) {
  const totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) return '';
  let html = `<span class="page-info">共 ${total} 条</span>`;
  html += `<button ${page === 1 ? 'disabled' : ''} onclick="goPage(${page - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button ${page === totalPages ? 'disabled' : ''} onclick="goPage(${page + 1})">›</button>`;
  return html;
}

function refreshTable() {
  const search = document.getElementById('searchInput')?.value || '';
  const typeFilter = document.getElementById('typeFilter')?.value || '';
  const statusFilter = document.getElementById('statusFilter')?.value || '';
  const audienceFilter = document.getElementById('audienceFilter')?.value || '';
  const priorityMin = document.getElementById('priorityMin')?.value;
  const priorityMax = document.getElementById('priorityMax')?.value;
  let data = pushes;
  if (search) {
    const q = search.toLowerCase();
    data = data.filter(d => d.name.toLowerCase().includes(q));
  }
  if (typeFilter) data = data.filter(d => d.type === typeFilter);
  if (statusFilter) data = data.filter(d => d.status === statusFilter);
  if (audienceFilter) data = data.filter(d => d.audience && d.audience.includes(audienceFilter));
  if (priorityMin !== '' && priorityMin !== undefined && priorityMin !== null) {
    const min = Number(priorityMin);
    data = data.filter(d => d.priority !== null && d.priority !== undefined && d.priority !== '' && Number(d.priority) >= min);
  }
  if (priorityMax !== '' && priorityMax !== undefined && priorityMax !== null) {
    const max = Number(priorityMax);
    data = data.filter(d => d.priority !== null && d.priority !== undefined && d.priority !== '' && Number(d.priority) <= max);
  }
  const total = data.length;
  const start = (currentPage - 1) * pageSize;
  const paged = data.slice(start, start + pageSize);
  renderTable(paged);
  document.getElementById('pagination').innerHTML = renderPagination(total, currentPage, pageSize);
}

function goPage(page) { currentPage = page; refreshTable(); }
function filterData() { currentPage = 1; refreshTable(); }
function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('typeFilter').value = '';
  document.getElementById('statusFilter').value = '';
  document.getElementById('audienceFilter').value = '';
  document.getElementById('priorityMin').value = '';
  document.getElementById('priorityMax').value = '';
  currentPage = 1;
  refreshTable();
}

// ===== 抽屉 =====
function openDrawer(mode, id) {
  drawerMode = mode;
  editingId = (mode === 'new') ? null : id;

  let p = null;
  if (id && mode !== 'new') {
    p = pushes.find(e => e.id === id);
  }

  // 只有草稿和待发送状态的推送可以编辑，其他状态强制切换为查看
  if (mode === 'edit' && p && p.status !== 'draft' && p.status !== 'pending') {
    drawerMode = 'view';
  }

  const titleMap = { new: '新建', edit: '编辑推送', view: '推送详情' };
  document.getElementById('editTitle').textContent = titleMap[drawerMode];

  const isView = drawerMode === 'view';
  document.getElementById('btnSave').style.display = isView ? 'none' : '';

  // 「保存草稿」仅在新建或编辑草稿时出现；待发送/进行中/已发送等状态下保存草稿无意义
  const showDraftBtn = !isView && (drawerMode === 'new' || (p && p.status === 'draft'));
  document.getElementById('btnDraft').style.display = showDraftBtn ? '' : 'none';

  editingAudience = p ? [...(p.audience || [])] : [];
  editingChannels = p ? [...(p.channels || [])] : [];
  editingAudienceEstimate = '';
  audienceBuilderCollapsed = true;

  renderDrawerForm(p, isView);
  if (!isView) {
    updateSubtitleHint();
    updateSaveBtnLabel();
  }

  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('editDrawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('editDrawer').classList.remove('open');
  editingId = null;
}

function renderDrawerForm(p, isView) {
  const body = document.getElementById('drawerBody');
  const disabled = isView ? 'disabled' : '';
  // 待发送状态：仅发送时间允许修改，其余字段置灰
  const isPendingEdit = !isView && p && p.status === 'pending';
  const pendingDisabled = isPendingEdit ? 'disabled' : '';
  const pushType = p ? p.type : 'manual';
  let triggerType = p ? (p.triggerType || 'fixed') : 'fixed';
  const isAuto = pushType === 'auto';

  let html = '';

  // 推送名称
  html += `<div class="form-group">
    <label><span class="required">*</span> 推送名称</label>
    <input type="text" id="pushName" value="${escapeHtml(p ? p.name : '')}" placeholder="如：新客24h未创建策略引导" ${disabled || pendingDisabled}>
  </div>`;

  // 目标人群（先选人群，再决定推送方式）
  // 新建、编辑(非待发送)：可视化条件构造器（自由配置）；查看/待发送：只读
  const useAudienceBuilder = (drawerMode === 'new' || (drawerMode === 'edit' && !isPendingEdit));
  let audienceInner;
  if (useAudienceBuilder) {
    audienceInner = renderAudienceBuilder();
  } else if (p && p.audienceSummary !== undefined && p.audienceSummary !== '') {
    // 由条件构造器创建的推送，查看/编辑暂以只读摘要展示（待复用条件构造器后支持编辑）

  </div>`;

  // 防骚扰设置（手动推送或定时发送或重复时间时不展示）
  const hideNoRepeat = pushType === 'manual' || (pushType === 'auto' && (triggerType === 'scheduled' || triggerType === 'fixed'));
  html += `<div id="noRepeatSection" class="conditional-section" style="margin-top:8px;${hideNoRepeat ? 'display:none' : ''}">
    <h5>防骚扰设置</h5>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px">
      <span style="font-size:14px;color:var(--text)">同一规则对同一用户仅触发一次</span>
      <label class="switch">
        <input type="checkbox" id="noRepeat" ${(p && p.noRepeat !== false) ? 'checked' : ''} ${disabled || pendingDisabled}>
        <span class="slider"></span>
      </label>
    </div>
  </div>`;

  body.innerHTML = html;
  // 编辑模式下，设置全部用户复选框的 indeterminate 状态
  if (!isView) {
    const allCheckbox = document.getElementById('audienceAllCheckbox');
    const allTagValues = audienceTags.map(t => t.value);
    if (allCheckbox && editingAudience.length > 0 && editingAudience.length < allTagValues.length) {
      allCheckbox.indeterminate = true;
    }
  }
}

function renderTriggerParams(triggerType, p, disabled, audience, isPendingEdit) {
  if (!triggerType) return '';
  const pendingDisabled = isPendingEdit ? 'disabled' : '';
  let html = '';

  if (triggerType === 'scheduled') {
    const scheduledTime = (p && p.pushTime) || '';
    // 待发送状态：仅发送时间可编辑
    html += `<div class="form-group">
      <label>发送时间</label>
      <input type="datetime-local" id="scheduledTime" value="${scheduledTime}" ${disabled} onclick="this.showPicker && this.showPicker()" style="cursor:pointer">
    </div>`;
  } else if (triggerType === 'fixed') {
    const cycle = (p && p.triggerCycle) || 'monthly';
    const dayOfWeek = (p && p.triggerDayOfWeek !== undefined) ? p.triggerDayOfWeek : 1;
    const dayOfMonth = (p && p.triggerDayOfMonth) ? p.triggerDayOfMonth : 1;
    const triggerTime = (p && p.triggerTime) ? p.triggerTime : '08:00';
    // 待发送状态：执行周期和周几/日期置灰，仅执行时间可编辑
    html += `<div class="form-row" style="align-items:flex-end">
      <div class="form-group">
        <label>执行周期</label>
        <select id="fixedCycle" ${disabled || pendingDisabled} onchange="onFixedCycleChange()">
          <option value="daily" ${cycle==='daily'?'selected':''}>每日</option>
          <option value="weekly" ${cycle==='weekly'?'selected':''}>每周</option>
          <option value="monthly" ${cycle==='monthly'?'selected':''}>每月</option>
        </select>
      </div>
      <div class="form-group" id="fixedDayGroup" style="${cycle==='daily'?'display:none':''}">
        <label>${cycle==='weekly'?'周几':'日期'}</label>
        ${cycle==='weekly' ? `
        <select id="fixedDayOfWeek" ${disabled || pendingDisabled}>
          <option value="1" ${dayOfWeek==1?'selected':''}>周一</option>
          <option value="2" ${dayOfWeek==2?'selected':''}>周二</option>
          <option value="3" ${dayOfWeek==3?'selected':''}>周三</option>
          <option value="4" ${dayOfWeek==4?'selected':''}>周四</option>
          <option value="5" ${dayOfWeek==5?'selected':''}>周五</option>
          <option value="6" ${dayOfWeek==6?'selected':''}>周六</option>
          <option value="0" ${dayOfWeek==0?'selected':''}>周日</option>
        </select>` : `
        <input type="number" id="fixedDayOfMonth" value="${dayOfMonth}" min="1" max="28" ${disabled || pendingDisabled} onblur="onMonthDayBlur()">`}
      </div>
      <div class="form-group">
        <label>执行时间</label>
        <input type="time" id="fixedTime" value="${triggerTime}" ${disabled}>
      </div>
    </div>`;
  } else if (triggerType === 'relative') {
    // 相对时间：从字段注册表的「时间类(datetime)字段」中选择 + 延迟 N 小时
    const timeFields = getDatetimeFields();
    const existingField = (p && p.relativeField) || (timeFields[0] ? timeFields[0].field : 'reg_time');
    const safeField = timeFields.some(f => f.field === existingField) ? existingField : (timeFields[0]?.field || 'reg_time');
    const existingDelay = (p && p.relativeDelay !== undefined && p.relativeDelay !== null && p.relativeDelay !== '')
      ? p.relativeDelay
      : (p && p.relativeTo !== undefined && p.relativeTo !== null && p.relativeTo !== '' ? p.relativeTo : 24);

    html += `<div class="form-row">
      <div class="form-group">
        <label>触发节点</label>
        <select id="relativeField" ${disabled || pendingDisabled}>
          ${timeFields.map(f => `<option value="${f.field}" ${f.field === safeField ? 'selected' : ''}>${formatTriggerNodeLabel(f.label)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>延迟时间</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" id="relativeDelay" value="${existingDelay}" min="0" max="999" step="1" style="width:80px" ${disabled || pendingDisabled} onblur="clampHourInput('relativeDelay')">
          <span>小时</span>
        </div>
      </div>
    </div>`;
  }

  return html;
}

function onPushTypeChange() {

function onPushLinkChange() {
  const link = document.getElementById('pushLink').value;
  const h5Section = document.getElementById('h5LinkSection');

    h5Section.style.display = link === 'h5' ? '' : 'none';

// 人群变更后刷新触发配置联动
function refreshTriggerSection() {
  const type = document.getElementById('pushType')?.value;
  if (type !== 'auto') return;
  const triggerSection = document.getElementById('triggerSection');
  if (!triggerSection || triggerSection.style.display === 'none') return;

  const disabled = document.getElementById('pushType')?.disabled ? 'disabled' : '';
  const audienceConstraints = getAudienceConstraints(editingAudience);

  // 读取当前触发方式值
  let tt = 'fixed';
  const existing = document.getElementById('triggerTypeSelect');
  if (existing) {
    tt = existing.value || 'fixed';
  }

  // 如果不支持相对且当前是 relative，切回 fixed
  const effectiveType = (!audienceConstraints.allowRelative && tt === 'relative') ? 'fixed' : tt;

  // 找到触发方式的父容器 form-group，替换内容
  const formGroup = existing?.closest('.form-group');
  if (formGroup) {
    const label = formGroup.querySelector('label');
    if (audienceConstraints.allowRelative) {
      formGroup.innerHTML = label.outerHTML + `<select id="triggerTypeSelect" ${disabled} onchange="onTriggerTypeChange()">
        <option value="scheduled" ${effectiveType==='scheduled'?'selected':''}>定时发送</option>
        <option value="fixed" ${effectiveType==='fixed'?'selected':''}>重复时间</option>
        <option value="relative" ${effectiveType==='relative'?'selected':''}>相对时间</option>
      </select>`;
    } else {
      formGroup.innerHTML = label.outerHTML + `<select id="triggerTypeSelect" ${disabled} onchange="onTriggerTypeChange()">
        <option value="scheduled" ${effectiveType==='scheduled'?'selected':''}>定时发送</option>
        <option value="fixed" ${effectiveType!=='scheduled'?'selected':''}>重复时间</option>
      </select>`;
    }
  }

  // 更新触发参数区
  const params = document.getElementById('triggerParams');
  if (params) {
    params.innerHTML = renderTriggerParams(effectiveType, null, disabled, editingAudience);
  }
}

// 根据推送类型/发送方式更新主按钮文案
function updateSaveBtnLabel() {
  const btn = document.getElementById('btnSave');
  if (!btn) return;
  const type = document.getElementById('pushType')?.value || 'manual';

function toggleTimeInput() {

function renderChannelSelector(isView, isDisabled) {

// ===== 人群选择器（分组展示）=====
function renderAudienceSelector(isView, isDisabled) {
  const allTagValues = audienceTags.map(t => t.value);

  if (isView || isDisabled) {
    // 查看模式/禁用模式：仅显示已选标签
    if (editingAudience.length === allTagValues.length) {
      return '<div class="tag-selector"><span class="tag-chip selected">全部用户</span></div>';
    }
    const selected = editingAudience.map(v => audienceTags.find(t => t.value === v)).filter(Boolean);
    if (selected.length === 0) return '<div class="tag-selector"><span style="color:var(--text-muted);font-size:12px">—</span></div>';
    return `<div class="tag-selector">${selected.map(t =>
      `<span class="tag-chip selected">${t.label}</span>`
    ).join('')}</div>`;
  }

  // 编辑模式：复选框列表
  const allSelected = editingAudience.length === allTagValues.length;
  const selected = editingAudience.map(v => audienceTags.find(t => t.value === v)).filter(Boolean);

  // 已选标签 chips
  const chipsHTML = allSelected
    ? '<span class="audience-dropdown-chip">全部用户<span class="remove" onclick="event.stopPropagation();clearAllAudience()">&times;</span></span>'
    : (selected.length > 0
      ? selected.map(t => `<span class="audience-dropdown-chip">${t.label}<span class="remove" onclick="event.stopPropagation();toggleAudience('${t.value}')">&times;</span></span>`).join('')
      : '<span class="placeholder">请选择目标人群</span>');

  // 下拉面板
  let panelHTML = `<div class="audience-dropdown-option" onclick="event.stopPropagation();toggleAllAudience()" style="border-bottom:1px solid var(--border);margin-bottom:4px;font-weight:500">
    <input type="checkbox" id="audienceAllCheckbox" ${allSelected ? 'checked' : ''} onclick="event.preventDefault()">
    <span>全部用户</span>
  </div>`;
  audienceTagGroups.forEach(group => {
    panelHTML += `<div class="audience-dropdown-group-label">${group.label}</div>`;
    group.tags.forEach(t => {
      const sel = editingAudience.includes(t.value);
      panelHTML += `<div class="audience-dropdown-option" onclick="event.stopPropagation();toggleAudience('${t.value}')">
        <input type="checkbox" ${sel ? 'checked' : ''} onclick="event.preventDefault()">
        <span>${t.label}</span>
      </div>`;
    });
  });

  return `<div class="audience-dropdown" id="audienceDropdown">
    <div class="audience-dropdown-trigger" onclick="event.stopPropagation();toggleAudienceDropdown()">
      <div class="audience-dropdown-chips">${chipsHTML}</div>
      <span class="audience-dropdown-arrow">&#9660;</span>
    </div>
    <div class="audience-dropdown-panel">${panelHTML}</div>
  </div>`;
}

  dd.classList.toggle('open');
}

function toggleAllAudience() {
  const allTagValues = audienceTags.map(t => t.value);

    editingAudience = [...allTagValues];

function buildAudienceSummaryFromData(audience) {
  const allTagValues = audienceTags.map(t => t.value);
  if (audience.length === 0 || audience.length === allTagValues.length) return '全部用户';
  const names = audience.map(getAudienceLabel);
  return names.length > 1 ? '（' + names.join(' 或 ') + '）' : names[0];
}

function randomizePushAudienceData() {
  const templates = JSON.parse(JSON.stringify(pushSeedTemplates));
  const allTagValues = audienceTags.map(t => t.value);
  return templates.map(push => {
    const p = { ...push };
    delete p.content_id;
    if (Math.random() < 0.12) {
      p.audience = [...allTagValues];
    } else {
      const cnt = 1 + Math.floor(Math.random() * Math.min(3, allTagValues.length));
      const shuffled = allTagValues.slice().sort(() => Math.random() - 0.5);
      p.audience = shuffled.slice(0, cnt);
    }
    delete p.audienceFlat;
    delete p.audienceRule;
    delete p.audienceCombine;
    p.audienceSummary = buildAudienceSummaryFromData(p.audience);
    return p;
  });
}

pushes = randomizePushAudienceData();
pushes.sort(() => Math.random() - 0.5);

// 模拟人数预估：仅用于原型演示，真实计算由人群服务执行
function estimateAudience() {
  const n = editingAudience.length;
  const base = 1268000;
  const est = n === 0 ? base : Math.max(800, Math.round(base / Math.pow(2.4, n) * (0.8 + Math.random() * 0.4)));

const VAR_LIMIT = 110; // iOS 锁屏 4 行推荐上限

function insertVariable(v) {
  const ta = document.getElementById('pushBody');
  if (!ta) return;
  const start = ta.selectionStart;
  const end = ta.selectionEnd;
  const text = ta.value;
  ta.value = text.slice(0, start) + v + text.slice(end);
  ta.selectionStart = ta.selectionEnd = start + v.length;

  updateCharCounter();

function updateCharCounter() {
  const ta = document.getElementById('pushBody');

}

// ===== 优先级冲突检测 =====
function checkPriorityConflict(audience, priority, excludeId) {
  const conflictItems = [];
  pushes.forEach(p => {
    if (excludeId && p.id === excludeId) return;
    if (p.status !== 'running' && p.status !== 'pending') return;
    if (Number(p.priority) !== Number(priority)) return;

    const reasons = [];
    if (p.audience && p.audience.length && audience && audience.length) {
      const intersected = p.audience.filter(tag => audience.includes(tag));
      if (intersected.length > 0) {
        const intersectedNames = intersected.map(tag => {
          const found = audienceTags.find(t => t.value === tag);
          return found ? found.label.split('（')[0] : tag;
        }).join('、');
        reasons.push('相同人群标签：' + intersectedNames);
      }
    }
    if (reasons.length === 0) return;
    conflictItems.push({ name: p.name, priority: p.priority, reason: reasons.join('；') });
  });
  if (conflictItems.length > 0) {
    const names = conflictItems.slice(0, 3).map((item, i) => `${i + 1}. ${item.name}（优先级 ${item.priority}，冲突原因：${item.reason}）`).join('<br>');
    const moreHint = conflictItems.length > 3 ? `<br>等共 ${conflictItems.length} 条` : '';
    showModal(`优先级冲突检测<br><br>以下推送与当前推送存在相同的目标人群标签且优先级同为 <b>${priority}</b>，可能导致推送行为不可预测：<br><br>${names}${moreHint}<br><br>请调整优先级数值或修改目标人群后再保存。`, null);
    return false;
  }
  return true;
}

// ===== 保存 =====
function savePush(action) {
  const name = document.getElementById('pushName').value.trim();
  const pushType = document.getElementById('pushType').value;
  const title = document.getElementById('pushTitle').value.trim();
  const subtitle = document.getElementById('pushSubtitle').value.trim();
  const link = document.getElementById('pushLink').value.trim();
  const linkUrl = document.getElementById('h5LinkUrl')?.value.trim() || '';
  const pushTypeForSave = document.getElementById('pushType').value;
  const triggerTypeForSave = document.getElementById('triggerTypeSelect')?.value || 'fixed';
  const hideNoRepeat = pushTypeForSave === 'manual' || (pushTypeForSave === 'auto' && (triggerTypeForSave === 'fixed' || triggerTypeForSave === 'scheduled'));
  const noRepeatEl = document.getElementById('noRepeat');
  const noRepeat = hideNoRepeat ? null : (noRepeatEl ? noRepeatEl.checked : true);

  if (!name) { showToast('请输入推送名称'); return; }
  if (!title) { showToast('请输入推送标题'); return; }
  if (editingChannels.length === 0) { showToast('请至少选择一个推送渠道'); return; }
  // 新建、编辑(非待发送)：校验条件构造器规则；查看/待发送：沿用原标签必填校验
  const existingPushForSave = editingId ? pushes.find(e => e.id === editingId) : null;
  const isPendingEditSave = !!(existingPushForSave && existingPushForSave.status === 'pending');
  const useAudienceBuilder = (drawerMode === 'new' || (drawerMode === 'edit' && !isPendingEditSave));
  // V1：仅快捷人群标签，不选标签表示全部用户
  if (link === 'h5' && !linkUrl) { showToast('请输入链接地址'); return; }
  let triggerType = '';
  let triggerDesc = '';
  let pushTime = '';
  let priority = 3;
  let triggerCycle = '';
  let triggerDayOfWeek = null;
  let triggerDayOfMonth = null;
  let triggerTimeVal = '';
  let relativeFieldVal = '';
  let relativeDelayVal = 0;

  const priorityVal = document.getElementById('pushPriority').value;
  if (priorityVal === '' || priorityVal === null || priorityVal === undefined) {
    showToast('请填写优先级'); return;
  }
  priority = parseFloat(priorityVal);
  if (isNaN(priority) || priority < 0 || priority > 100) { showToast('优先级需在0-100之间'); return; }
  // 保留最多1位小数
  priority = Math.round(priority * 10) / 10;

  if (!checkPriorityConflict(editingAudience, priority, editingId)) {
    return;
  }

  if (pushType === 'auto') {
    triggerType = document.getElementById('triggerTypeSelect').value;
    if (!triggerType) { showToast('请选择触发方式'); return; }

    if (triggerType === 'scheduled') {
      const scheduledTime = document.getElementById('scheduledTime').value;
      if (!scheduledTime) { showToast('请选择发送时间'); return; }
      pushTime = scheduledTime;
      triggerDesc = `定时发送 ${scheduledTime}`;
    } else if (triggerType === 'fixed') {
      const cycle = document.getElementById('fixedCycle').value;
      const time = document.getElementById('fixedTime').value;
      triggerCycle = cycle;
      triggerTimeVal = time;
      if (cycle === 'daily') {
        triggerDesc = `每日 ${time}`;
      } else if (cycle === 'weekly') {
        const dow = parseInt(document.getElementById('fixedDayOfWeek').value);
        triggerDayOfWeek = dow;
        const dowMap = { 1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六',0:'周日' };
        triggerDesc = `每${dowMap[dow] || '周一'} ${time}`;
      } else {
        const day = document.getElementById('fixedDayOfMonth').value;
        triggerDayOfMonth = parseInt(day) || 1;
        triggerDesc = `每月${day}日 ${time}`;
      }
    } else if (triggerType === 'relative') {
      const field = document.getElementById('relativeField').value;
      const delay = parseInt(document.getElementById('relativeDelay').value);
      if (!field) { showToast('请选择触发节点'); return; }
      if (isNaN(delay) || delay < 0 || delay > 999) { showToast('延迟时间需为0-999的整数'); return; }
      relativeFieldVal = field;
      relativeDelayVal = delay;
      const fieldDef = findAudienceFieldDef(field);
      triggerDesc = `${fieldDef ? formatTriggerNodeLabel(fieldDef.label) : field} 延迟${delay}小时`;
    }
  } else {
    pushTime = ''; // 手动推送只能立即发送
  }

  // 手动推送：定时发送 => 待发送；立即发送 => 已发送
  const manualScheduled = pushType === 'manual' && !!pushTime;
  const manualStatus = manualScheduled ? 'pending' : 'sent';

  const now = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');

  if (editingId) {
    const p = pushes.find(e => e.id === editingId);
    if (p) {
      p.name = name;
      p.type = pushType;
      p.channels = [...editingChannels];
      p.audience = [...editingAudience];
      if (useAudienceBuilder) {
        p.audienceSummary = buildAudienceSummary();
        delete p.audienceRule;
        delete p.audienceFlat;
        delete p.audienceCombine;
      }
      p.triggerType = triggerType;
      p.triggerDesc = triggerDesc;
      p.triggerCycle = triggerCycle;
      p.triggerDayOfWeek = triggerDayOfWeek;
      p.triggerDayOfMonth = triggerDayOfMonth;
      p.triggerTime = triggerTimeVal;
      p.relativeField = relativeFieldVal;
      p.relativeDelay = relativeDelayVal;
      delete p.relativeFrom;
      delete p.relativeTo;
      p.priority = priority;
      p.title = title;
      p.subtitle = subtitle;
      p.link = link;
      p.linkUrl = linkUrl;
      p.pushTime = pushTime;
      p.noRepeat = noRepeat;
      if (action === 'save') {
        // 自动规则：定时发送为待发送，其他为运行中；手动推送：定时发送为待发送，立即发送为已发送
        p.status = pushType === 'auto' 
          ? (triggerType === 'scheduled' ? 'pending' : 'running')
          : manualStatus;
      }
    }
  } else {
    pushes.unshift({
      id: nextId++,
      name,
      type: pushType,
      channels: [...editingChannels],
      audience: [...editingAudience],
      audienceSummary: useAudienceBuilder ? buildAudienceSummary() : '',
      triggerType,
      triggerDesc,
      triggerCycle,
      triggerDayOfWeek,
      triggerDayOfMonth,
      triggerTime: triggerTimeVal,
      relativeField: relativeFieldVal,
      relativeDelay: relativeDelayVal,
      priority,
      status: action === 'save' 
        ? (pushType === 'auto' 
          ? (triggerType === 'scheduled' ? 'pending' : 'running')
          : manualStatus) 
        : 'draft',
      title,
      subtitle,
      link,
      linkUrl,
      pushTime,
      noRepeat,
      createTime: now,
      creator: '当前用户'
    });
  }

  if (action === 'save' && pushType === 'manual') {
    showToast(manualScheduled ? '已设置定时发送' : '推送已发送', 'success');
  } else {
    showToast('保存成功', 'success');
  }
  closeDrawer();
  refreshTable();
}

// ===== 发送确认 =====
let sendTargetId = null;

function openSendConfirm(id) {
  sendTargetId = id;
  const p = pushes.find(e => e.id === id);
  if (!p) return;

  const channelStr = (p.channels || []).map(c => getChannelLabel(c)).join('、');
  const totalAudienceTags = audienceTags.length;
  let audienceStr;
  if (p.audienceSummary !== undefined && p.audienceSummary !== '') {
    audienceStr = p.audienceSummary || '全部用户';
  } else if ((p.audience || []).length === totalAudienceTags) {
    audienceStr = '全部用户';
  } else {
    audienceStr = (p.audience || []).map(a => getAudienceLabel(a)).join('、');
  }

  document.getElementById('sendModalMsg').innerHTML = `
    即将发送推送「<b>${escapeHtml(p.name)}</b>」<br><br>
    渠道：${channelStr}<br>
    目标人群：${audienceStr}<br>
    标题：${escapeHtml(p.title)}<br>
    副标题：${escapeHtml(p.subtitle || '(无)')}
  `;

  document.getElementById('sendModalWarning').style.display = 'none';
  document.getElementById('sendModal').style.display = 'flex';
}

function closeSendModal() {
  sendTargetId = null;
  document.getElementById('sendModal').style.display = 'none';
}

function confirmSend() {
  if (sendTargetId !== null) {
    const p = pushes.find(e => e.id === sendTargetId);
    if (p) {
      p.status = 'sent';
      const now = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
      p.createTime = now;
    }
    sendTargetId = null;
    document.getElementById('sendModal').style.display = 'none';
    refreshTable();
    showToast('推送已发送', 'success');
  }
}

// ===== 自动规则开关 =====
function toggleAutoRule(id) {
  const p = pushes.find(e => e.id === id);
  if (!p) return;
  if (p.status === 'running') {
    p.status = 'paused';
    showToast('规则已暂停');
  } else if (p.status === 'paused') {
    if (!checkPriorityConflict(p.audience || [], p.priority, p.id)) {
      return;
    }
    p.status = 'running';
    showToast('规则已启用');
  }
  refreshTable();
}

// ===== 取消定时（待发送 → 草稿）=====
function cancelSchedule(id) {
  const p = pushes.find(e => e.id === id);
  if (!p) return;
  if (confirm('确定取消该推送的定时发送吗？取消后将转为草稿。')) {
    p.status = 'draft';
    p.pushTime = '';
    refreshTable();
    showToast('已取消定时，转为草稿');
  }
}

// ===== 删除确认弹窗（与语料包后台一致）=====
let pendingDeleteAction = null;

function openDeleteModal(title, msg, onConfirm) {
  document.getElementById('deleteModalTitle').textContent = title;
  document.getElementById('deleteModalMsg').innerHTML = msg;
  pendingDeleteAction = onConfirm;
  document.getElementById('deleteModal').style.display = 'flex';
}

function closeDeleteModal() {
  pendingDeleteAction = null;
  document.getElementById('deleteModal').style.display = 'none';
}

function confirmDeleteModal() {
  const action = pendingDeleteAction;
  closeDeleteModal();
  if (action) action();
}

// ===== 删除 =====
function deletePush(id) {
  const p = pushes.find(e => e.id === id);
  const name = p ? p.name : '';
  openDeleteModal('删除推送', `确定删除推送${name ? '「' + escapeHtml(name) + '」' : ''}吗？删除后不可恢复。`, () => {
    pushes = pushes.filter(e => e.id !== id);
    refreshTable();
    showToast('已删除');
  });
}

// ===== 优先级输入失焦校验 =====
function onPriorityBlur() {
  const input = document.getElementById('pushPriority');
  if (!input) return;
  const val = input.value.trim();
  if (val === '') {
    input.classList.remove('input-error');
    return;
  }
  const num = parseFloat(val);
  // 非数值或超出范围 → 清空+标红+提示
  if (isNaN(num) || num < 0 || num > 100) {
    input.value = '';
    input.classList.add('input-error');
    showToast('请输入0-100范围内的数值', 'error');
    return;
  }
  // 合法数值 → 四舍五入保留1位小数
  input.value = Math.round(num * 10) / 10;
  input.classList.remove('input-error');
}

function onMonthDayBlur() {
  const input = document.getElementById('fixedDayOfMonth');
  if (!input) return;
  const val = input.value.trim();
  if (val === '') {
    input.classList.remove('input-error');
    return;
  }
  const num = parseFloat(val);
  if (isNaN(num) || num < 1 || num > 28) {
    input.value = '';
    input.classList.add('input-error');
    showToast('请输入1-28范围内的整数', 'error');
    return;
  }
  input.value = Math.round(num);
  input.classList.remove('input-error');
}

// 小时输入校验（0-999 整数），用于「相对时间」的延迟时间
function clampHourInput(id) {
  const input = document.getElementById(id);
  if (!input) return;
  const val = input.value.trim();
  if (val === '') {
    input.classList.remove('input-error');
    return;
  }
  const num = parseFloat(val);
  if (isNaN(num) || num < 0 || num > 999) {
    input.value = '';
    input.classList.add('input-error');
    showToast('请输入0-999范围内的整数', 'error');
    return;
  }
  input.value = Math.round(num);
  input.classList.remove('input-error');
}

function updateSubtitleHint() {
  const hint = document.getElementById('subtitleHint');
  if (!hint) return;
  hint.innerHTML = '';
}

// ===== Toast =====
function showToast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ===== Modal =====
function showModal(htmlContent, onConfirm) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  const cancelBtn = document.getElementById('modalCancel');
  if (!overlay || !content) return;
  content.innerHTML = htmlContent;
  overlay.style.display = 'flex';
  const close = function() { overlay.style.display = 'none'; };
  cancelBtn.onclick = function() { close(); if (typeof onConfirm === 'function') onConfirm(false); };
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  if (overlay) overlay.style.display = 'none';
}

// ===== 初始化 =====
refreshTable();
</script>
