<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化王管理后台 - 推送管理</title>
<style>
:root {
  --bg: #f4f5f8;
  --surface: #fafbfd;
  --sidebar-bg: #1a1d24;
  --sidebar-text: #9ba3b4;
  --sidebar-active: #e8edf5;
  --sidebar-active-bg: rgba(74, 108, 247, 0.1);
  --text: #1e2130;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: #e5e7ed;
  --accent: #3b6df0;
  --primary: #3b6df0;
  --accent-light: #e8edf9;
  --danger: #e5484d;
  --danger-light: #fef2f2;
  --success: #30a46c;
  --success-light: #eef9f2;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Sidebar */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  user-select: none;
}

.sidebar-logo {
  padding: 20px 18px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.sidebar-logo h1 {
  font-size: 16px;
  font-weight: 700;
  color: #e8edf5;
  letter-spacing: .5px;
}

.sidebar-logo span {
  font-size: 11px;
  color: var(--sidebar-text);
  display: block;
  margin-top: 2px;
  font-weight: 400;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.nav-section { margin-bottom: 4px; }

.nav-item {
  display: flex;
  align-items: center;
  padding: 9px 18px;
  color: var(--sidebar-text);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 13px;
  gap: 10px;
  border-left: 2px solid transparent;
  text-decoration: none;
}

.nav-item:hover {
  color: #c8cedb;
  background: rgba(255,255,255,0.03);
}

.nav-item.active {
  color: #c8d4f7;
  background: rgba(59, 109, 240, 0.12);
  border-left-color: var(--accent);
  font-weight: 600;
}

.nav-item .icon {
  width: 18px;
  height: 18px;
  opacity: 0.6;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-item.active .icon { opacity: 0.9; }

.nav-group-header {
  display: flex;
  align-items: center;
  padding: 9px 18px;
  color: var(--sidebar-text);
  cursor: pointer;
  font-size: 13px;
  gap: 10px;
  transition: all var(--transition);
}

.nav-group-header:hover {
  color: #c8cedb;
  background: rgba(255,255,255,0.03);
}

.nav-group-header .arrow {
  margin-left: auto;
  font-size: 10px;
  transition: transform var(--transition);
}

.nav-group.open .nav-group-header .arrow {
  transform: rotate(90deg);
}

.nav-sub {
  overflow: hidden;
  max-height: 0;
  transition: max-height 250ms ease;
}

.nav-group.open .nav-sub {
  max-height: 200px;
}

.nav-sub .nav-item {
  padding-left: 46px;
  font-size: 12.5px;
}

/* Main Area */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-bar {
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  flex-shrink: 0;
}

.breadcrumb {
  font-size: 13px;
  color: var(--text-secondary);
}

.breadcrumb span {
  color: var(--text-muted);
  margin: 0 6px;
}

.breadcrumb .current {
  color: var(--text);
  font-weight: 600;
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

/* Page Header */
.page-header {
  margin-bottom: 18px;
}

.page-header h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

/* Filter Bar */
.filter-bar {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.filter-bar input[type="text"],
.filter-bar select {
  height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 10px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  transition: border-color var(--transition);
  outline: none;
}

.filter-bar input[type="text"]:focus,
.filter-bar select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.filter-bar input[type="text"] { width: 220px; }
.filter-bar select { width: 130px; }
.filter-bar input::placeholder { color: var(--text-muted); }

.btn {
  height: 34px;
  padding: 0 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  font-weight: 500;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #2f5cd6; }

.btn-default {
  background: #fff;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-default:hover { background: var(--bg); border-color: #cdd2db; }

.btn-new { margin-left: auto; }

.btn-danger-text {
  color: var(--danger);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius);
}
.btn-danger-text:hover { background: var(--danger-light); }

.btn-edit-text {
  color: var(--accent);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius);
  margin-right: 2px;
}
.btn-edit-text:hover { background: var(--accent-light); }

.btn-send {
  color: var(--success);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  border-radius: var(--radius);
  margin-right: 2px;
}
.btn-send:hover { background: var(--success-light); }

/* Table */
.table-container {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow-x: auto;
  overflow-y: hidden;
}

table {
  width: 100%;
  min-width: max-content;
  border-collapse: separate;
  border-spacing: 0;
}

thead th {
  background: #f8f9fb;
  padding: 11px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  position: sticky;
  top: 0;
  z-index: 1;
}

thead th.col-actions {
  position: sticky;
  right: 0;
  z-index: 2;
  background: #f8f9fb;
  box-shadow: -4px 0 8px -4px rgba(0,0,0,0.08);
}

tbody td {
  padding: 12px 14px;
  font-size: 13px;
  border-bottom: 1px solid #f0f1f5;
  color: var(--text);
  vertical-align: middle;
  background: var(--surface);
}

tbody td.col-actions {
  position: sticky;
  right: 0;
  background: var(--surface);
  z-index: 1;
  box-shadow: -4px 0 8px -4px rgba(0,0,0,0.08);
}

tbody tr:hover td { background: #fafbfd; }
tbody tr:hover td.col-actions { background: #fafbfd; }

tbody tr:last-child td { border-bottom: none; }

.td-ellipsis {
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

/* Status Badge */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
}

.status-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.status-badge.running { color: var(--success); }
.status-badge.running::before { background: var(--success); }
.status-badge.paused { color: var(--warning); }
.status-badge.paused::before { background: var(--warning); }

/* Copy ID Button */
.copy-id-btn {
  cursor: pointer;
  color: var(--accent);
  margin-left: 6px;
  vertical-align: middle;
  display: inline-flex;
  align-items: center;
  opacity: 0.6;
  transition: opacity 0.15s;
}
.copy-id-btn:hover { opacity: 1; }
.copy-id-btn:active { opacity: 0.4; }

/* Toggle Switch */
.toggle-switch {
  position: relative;
  display: inline-block;
  width: 36px;
  height: 20px;
  vertical-align: middle;
}
.toggle-switch input { display: none; }
.toggle-slider {
  position: absolute;
  inset: 0;
  background: #d1d5db;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.2s;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  width: 16px;
  height: 16px;
  left: 2px;
  top: 2px;
  background: white;
  border-radius: 50%;
  transition: transform 0.2s;
}
.toggle-switch input:checked + .toggle-slider { background: var(--accent); }
.toggle-switch input:checked + .toggle-slider::before { transform: translateX(16px); }
/* 只读/禁用状态：明确不可点击 */
.toggle-switch input:disabled + .toggle-slider { cursor: not-allowed; opacity: 0.45; }
.toggle-switch.is-readonly { cursor: not-allowed; }
.status-badge.draft { color: var(--text-muted); }
.status-badge.draft::before { background: var(--text-muted); }
.status-badge.sent { color: var(--accent); }
.status-badge.sent::before { background: var(--accent); }
.status-badge.pending { color: #7c5cff; }
.status-badge.pending::before { background: #7c5cff; }

/* Tags */
.tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
}

.tag-blue { background: #eef2ff; color: #4f46e5; }
.tag-green { background: #ecfdf5; color: #047857; }
.tag-orange { background: #fef3c7; color: #b45309; }

.type-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 4px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}

.type-tag.manual { background: #eef2ff; color: #4f46e5; }
.type-tag.auto { background: #fdf2f8; color: #be185d; }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 14px 20px;
  gap: 6px;
  border-top: 1px solid #f0f1f5;
}

.pagination .page-info {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-right: 10px;
}

.pagination button {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: all var(--transition);
  font-family: var(--font);
}

.pagination button:hover { border-color: var(--accent); color: var(--accent); }
.pagination button.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
.pagination button:disabled { opacity: 0.4; cursor: not-allowed; }

/* Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  cursor: pointer;
}

.switch input { opacity: 0; width: 0; height: 0; }

.switch .slider {
  position: absolute;
  inset: 0;
  background: #d1d5db;
  border-radius: 22px;
  transition: all 200ms ease;
}

.switch .slider::before {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  left: 2px;
  bottom: 2px;
  background: #fff;
  border-radius: 50%;
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 1px 2px rgba(0,0,0,0.12);
}

.switch input:checked + .slider { background: var(--success); }
.switch input:checked + .slider::before { transform: translateX(18px); }

/* Drawer */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 200ms ease, visibility 200ms ease;
}

.drawer-overlay.open { opacity: 1; visibility: visible; }

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: 560px;
  height: 100vh;
  background: var(--surface);
  box-shadow: -4px 0 20px rgba(0, 0, 0, 0.12);
  z-index: 1000;
  transform: translateX(100%);
  transition: transform 250ms cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.drawer.open { transform: translateX(0); }

.drawer-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.drawer-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.drawer-footer {
  padding: 20px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

/* Form */
.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-group label .required {
  color: var(--danger);
  font-size: 14px;
  line-height: 1;
}

.form-group .hint {
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 4px;
}

.form-group select,
.form-group input[type="text"],
.form-group input[type="number"],
.form-group input[type="datetime-local"],
.form-group textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  outline: none;
  transition: border-color var(--transition);
}

.form-group select:focus,
.form-group input[type="text"]:focus,
.form-group input[type="number"]:focus,
.form-group input[type="datetime-local"]:focus,
.form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.input-error {
  border-color: var(--danger) !important;
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1) !important;
}

.form-group textarea {
  min-height: 80px;
  resize: vertical;
  line-height: 1.6;
}

.char-counter { font-size: 11px; color: var(--text-muted); margin-left: auto; white-space: nowrap; }
.char-counter.warn { color: #d97706; }
.char-counter.over { color: #dc2626; }

.form-group select:disabled,
.form-group input:disabled,
.form-group textarea:disabled {
  background: #f4f5f8;
  color: var(--text-secondary);
  cursor: default;
  border-color: #e8e9ee;
  opacity: 1;
  -webkit-text-fill-color: var(--text-secondary);
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

.form-row-3 {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
}

/* Conditional section */
.conditional-section {
  background: #f8f9fb;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  margin-top: 8px;
}

.conditional-section h5 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}

/* Tag Selector */
.tag-selector {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.tag-chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 12px;
  border: 1px solid var(--border);
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  background: #fff;
  color: var(--text-secondary);
  transition: all var(--transition);
  user-select: none;
}

.tag-chip:hover { border-color: var(--accent); }

.tag-chip.selected {
  background: var(--accent-light);
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 500;
}

/* Switch Row */
.switch-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* ===== 目标人群分组下拉多选 ===== */
.audience-dropdown { position: relative; }
.audience-dropdown-trigger {
  display: flex; align-items: center; justify-content: space-between;
  min-height: 40px; padding: 4px 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: #fff; cursor: pointer; gap: 8px;
  transition: border-color var(--transition);
}
.audience-dropdown-trigger:hover { border-color: var(--accent); }
.audience-dropdown-trigger:focus-within,
.audience-dropdown.open > .audience-dropdown-trigger { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
.audience-dropdown-chips {
  display: flex; flex-wrap: wrap; gap: 5px; flex: 1; min-width: 0;
}
.audience-dropdown-chips .placeholder {
  color: var(--text-muted); font-size: 13px; padding: 4px 0;
}
.audience-dropdown-arrow {
  font-size: 11px; color: var(--text-muted); flex-shrink: 0;
  transition: transform 0.2s;
}
.audience-dropdown.open > .audience-dropdown-trigger .audience-dropdown-arrow {
  transform: rotate(180deg);
}
.audience-dropdown-panel {
  display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  max-height: 320px; overflow-y: auto;
  background: #fff; border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.1); z-index: 100; padding: 8px 0;
}
.audience-dropdown.open > .audience-dropdown-panel { display: block; }
.audience-dropdown-group-label {
  font-size: 11px; font-weight: 600; color: var(--text-muted);
  padding: 6px 14px 4px; text-transform: none;
}
.audience-dropdown-option {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px; font-size: 13px; color: var(--text-primary);
  cursor: pointer; transition: background 0.15s;
}
.audience-dropdown-option:hover { background: #f3f4f6; }
.audience-dropdown-option input[type="checkbox"] {
  width: 15px; height: 15px; margin: 0; flex-shrink: 0;
  accent-color: var(--accent); cursor: pointer;
}
.audience-dropdown-option input[type="checkbox"]:indeterminate {
  accent-color: var(--accent);
}
.audience-dropdown-chip {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 12px;
  background: var(--accent-light); color: var(--accent);
  font-size: 12px; font-weight: 500;
}
.audience-dropdown-chip .remove {
  cursor: pointer; font-size: 14px; line-height: 1; opacity: 0.6;
}
.audience-dropdown-chip .remove:hover { opacity: 1; }

/* ===== 目标人群条件构造器 ===== */
.aud-builder { border:1px solid var(--border); border-radius:10px; padding:12px; background:#fafbfc; }
.aud-builder-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.aud-builder-hint { font-size:12px; color:var(--text-muted); }
.aud-preset-select { height:30px; border:1px solid var(--border); border-radius:6px; font-size:12px; padding:0 8px; background:#fff; color:var(--text-primary); cursor:pointer; }
.aud-group { border:1px dashed var(--border); border-radius:8px; padding:10px 10px 10px 12px; background:#fff; }
.aud-group.nested { background:#f6f8fc; border-color:#c7d2fe; margin:6px 0; }
.aud-group-bar { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.aud-logic-seg { display:inline-flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
.aud-logic-seg button { border:none; background:#fff; font-size:12px; padding:4px 10px; cursor:pointer; color:var(--text-secondary); }
.aud-logic-seg button.active { background:var(--accent); color:#fff; }
.aud-logic-label { font-size:12px; color:var(--text-muted); }
.aud-cond { display:flex; align-items:center; gap:6px; margin:6px 0; flex-wrap:wrap; }
.aud-cond select, .aud-cond input { height:32px; border:1px solid var(--border); border-radius:6px; font-size:13px; padding:0 8px; background:#fff; color:var(--text-primary); }

function getAudienceLabel(val) {
  const found = audienceTags.find(t => t.value === val);
  return found ? found.label.split('（')[0] : val;
}

function getAudienceShortLabel(val) {
  const found = audienceTags.find(t => t.value === val);
  if (!found) return val;
  // 取括号前部分，若无括号则截取前6字
  const base = found.label.split('（')[0].split('(')[0];
  return base.length > 6 ? base.slice(0, 6) + '…' : base;
}

function getPriorityLabel(p, type) {
  if (p === null || p === undefined || p === '') return '<span style="color:var(--text-muted);font-size:12px">--</span>';
  const num = Number(p);
  let color = 'var(--text-secondary)';
  if (num <= 10) color = '#ef4444';
  else if (num <= 30) color = '#f59e0b';
  else if (num <= 70) color = 'var(--text-secondary)';
  else color = 'var(--text-muted)';
  return `<span style="font-size:12px;color:${color};font-weight:500">${p}</span>`;
}

        'plaza_report': '广场-内容广场-研报', 'plaza_learn': '广场-内容广场-学习',
        'plaza_chat': '广场-社区广场-热聊', 'plaza_strategy': '广场-社区广场-策略',
        'user_manual': '用户手册', 'profile': '个人主页', 'master_board': '量化大师榜',

      };

        ? `<span style="font-size:12px">自定义链接：${escapeHtml(item.linkUrl)}</span>`

    }

    return `
      <tr>
        <td>${idx + 1}</td>
        <td><div class="td-ellipsis" title="${escapeHtml(item.name)}">${escapeHtml(item.name)}</div></td>

      </tr>
    `;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderPagination(total, page, pageSize) {
  const totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) return '';
  let html = `<span class="page-info">共 ${total} 条</span>`;
  html += `<button ${page === 1 ? 'disabled' : ''} onclick="goPage(${page - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button ${page === totalPages ? 'disabled' : ''} onclick="goPage(${page + 1})">›</button>`;
  return html;
}

let currentPage = 1;
const pageSize = 10;

// ===== 页面切换 =====
let currentMainPage = 'pushManage';
function switchToPage(page) {

function refreshTable() {
  const search = document.getElementById('searchInput')?.value || '';
  const typeFilter = document.getElementById('typeFilter')?.value || '';
  const statusFilter = document.getElementById('statusFilter')?.value || '';
  const audienceFilter = document.getElementById('audienceFilter')?.value || '';
  const priorityMin = document.getElementById('priorityMin')?.value;
  const priorityMax = document.getElementById('priorityMax')?.value;
  let data = pushes;
  if (search) {
    const q = search.toLowerCase();
    data = data.filter(d => d.name.toLowerCase().includes(q));
  }
  if (typeFilter) data = data.filter(d => d.type === typeFilter);
  if (statusFilter) data = data.filter(d => d.status === statusFilter);
  if (audienceFilter) data = data.filter(d => d.audience && d.audience.includes(audienceFilter));
  if (priorityMin !== '' && priorityMin !== undefined && priorityMin !== null) {
    const min = Number(priorityMin);
    data = data.filter(d => d.priority !== null && d.priority !== undefined && d.priority !== '' && Number(d.priority) >= min);
  }
  if (priorityMax !== '' && priorityMax !== undefined && priorityMax !== null) {
    const max = Number(priorityMax);
    data = data.filter(d => d.priority !== null && d.priority !== undefined && d.priority !== '' && Number(d.priority) <= max);
  }
  const total = data.length;
  const start = (currentPage - 1) * pageSize;
  const paged = data.slice(start, start + pageSize);
  renderTable(paged);
  document.getElementById('pagination').innerHTML = renderPagination(total, currentPage, pageSize);
}

function goPage(page) { currentPage = page; refreshTable(); }
function filterData() { currentPage = 1; refreshTable(); }
function resetFilters() {
  document.getElementById('searchInput').value = '';
  document.getElementById('typeFilter').value = '';
  document.getElementById('statusFilter').value = '';
  document.getElementById('audienceFilter').value = '';
  document.getElementById('priorityMin').value = '';
  document.getElementById('priorityMax').value = '';
  currentPage = 1;
  refreshTable();
}

// ===== 抽屉 =====
function openDrawer(mode, id) {
  drawerMode = mode;
  editingId = (mode === 'new') ? null : id;

  let p = null;
  if (id && mode !== 'new') {
    p = pushes.find(e => e.id === id);
  }

  // 只有草稿和待发送状态的推送可以编辑，其他状态强制切换为查看
  if (mode === 'edit' && p && p.status !== 'draft' && p.status !== 'pending') {
    drawerMode = 'view';
  }

  const titleMap = { new: '新建', edit: '编辑推送', view: '推送详情' };
  document.getElementById('editTitle').textContent = titleMap[drawerMode];

  const isView = drawerMode === 'view';
  document.getElementById('btnSave').style.display = isView ? 'none' : '';

  // 「保存草稿」仅在新建或编辑草稿时出现；待发送/进行中/已发送等状态下保存草稿无意义
  const showDraftBtn = !isView && (drawerMode === 'new' || (p && p.status === 'draft'));
  document.getElementById('btnDraft').style.display = showDraftBtn ? '' : 'none';

  editingAudience = p ? [...(p.audience || [])] : [];
  editingChannels = p ? [...(p.channels || [])] : [];
  // 新建/编辑面板都使用条件构造器；编辑时从已存的扁平规则恢复自定义条件
  if (p && p.audienceFlat && Array.isArray(p.audienceFlat.conditions)) {
    editingAudienceRule = JSON.parse(JSON.stringify({
      logic: 'AND',
      conditions: p.audienceFlat.conditions,
      ops: p.audienceFlat.ops || []
    }));
  } else {
    editingAudienceRule = { logic: 'AND', conditions: [], ops: [] };
  }
  editingAudienceEstimate = '';
  editingAudienceCombine = (p && p.audienceCombine) ? p.audienceCombine : 'AND';
  audienceBuilderCollapsed = true;
  audiencePreviewExpanded = null;
  audienceCustomPopupOpen = false;

  // 保存原始的 link 值，用于取消选择文章时恢复
  window._lastLinkVal = p ? (p.link || 'msg_detail') : 'msg_detail';

  renderDrawerForm(p, isView);
  if (!isView) {
    updateSubtitleHint();
    updateSaveBtnLabel();
    const isPending = p && p.status === 'pending';
    if (!isPending) onArticleSelectChange();
  }

  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('editDrawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('editDrawer').classList.remove('open');
  editingId = null;
}

function renderDrawerForm(p, isView) {
  const body = document.getElementById('drawerBody');

  const pendingDisabled = isPendingEdit ? 'disabled' : '';

  // 根据人群约束调整触发方式默认值

  if (!audienceConstraints.allowRelative && triggerType === 'relative') {
    triggerType = 'fixed';
  }
  html += `<div class="form-group">
    <label><span class="required">*</span> 推送类型</label>
    <select id="pushType" ${disabled || pendingDisabled} onchange="onPushTypeChange()">

  // 触发配置（自动规则时显示，根据目标人群联动）
  html += `<div id="triggerSection" style="${isAuto ? '' : 'display:none'}">
    <div class="conditional-section">
      <h5>触发规则配置</h5>
      <div class="form-group">
        <label><span class="required">*</span> 触发方式</label>
        ${audienceConstraints.allowRelative
          ? `<select id="triggerTypeSelect" ${disabled || pendingDisabled} onchange="onTriggerTypeChange()">
               <option value="scheduled" ${triggerType==='scheduled'?'selected':''}>定时发送</option>
               <option value="fixed" ${triggerType==='fixed'?'selected':''}>重复时间</option>
               <option value="relative" ${triggerType==='relative'?'selected':''}>相对时间</option>
             </select>`
          : `<select id="triggerTypeSelect" ${disabled || pendingDisabled} onchange="onTriggerTypeChange()">
               <option value="scheduled" ${triggerType==='scheduled'?'selected':''}>定时发送</option>
               <option value="fixed" ${triggerType!=='scheduled'&&triggerType!=='relative'?'selected':''}>重复时间</option>

      </div>
      <div id="triggerParams" style="display:${triggerType ? '' : 'none'}">

    <div class="hint">0-100，最多1位小数，数值越小优先级越高。同一用户同时命中多条规则时，仅推送优先级最高的一条，其余丢弃</div>
  </div>`;

  // 内容配置
  const channels = p ? (p.channels || []) : [];
  html += `<div class="form-group">
    <label><span class="required">*</span> 推送渠道</label>
    <div id="channelSelector">${renderChannelSelector(isView, isPendingEdit)}</div>
  </div>`;

  html += `<div class="form-group">
    <label><span class="required">*</span> 推送标题 <span class="hint">（Push建议≤30字）</span></label>
    <input type="text" id="pushTitle" value="${escapeHtml(p ? p.title : '')}" placeholder="如：【量化王】新客福利，解锁低风险量化策略👉" maxlength="50" ${disabled || pendingDisabled}>
  </div>`;

  html += `<div class="form-group">
    <label>副标题 <span class="hint">（非必填，消息列表中的描述文本）</span></label>

  html += `<div class="form-group">

  // 跳转链接显示

  if (isView) {
    if (p && p.content_id) {
      linkFieldHtml = `<div style="font-size:13px;color:var(--text)">文章详情</div>`;
    } else if (p && p.link === 'h5') {

  }

  html += `<div class="form-group">
    <label>跳转链接 <span class="hint">（点击推送后跳转的App内页面，选择文章时自动指向文章详情页）</span></label>

  </div>`;

  // 推送时间（手动推送时不展示，因为只能立即发送）
  html += `<div id="timeSection" style="display:none"></div>`;

  // 防骚扰设置（手动推送或定时发送或重复时间时不展示）

      <label class="switch">

  body.innerHTML = html;

  if (!isView) {
    const allCheckbox = document.getElementById('audienceAllCheckbox');

    if (allCheckbox && editingAudience.length > 0 && editingAudience.length < allTagValues.length) {

function renderTriggerParams(triggerType, p, disabled, audience, isPendingEdit) {
  if (!triggerType) return '';
  const pendingDisabled = isPendingEdit ? 'disabled' : '';
  let html = '';

  if (triggerType === 'scheduled') {
    const scheduledTime = (p && p.pushTime) || '';
    // 待发送状态：仅发送时间可编辑
    html += `<div class="form-group">
      <label>发送时间</label>
      <input type="datetime-local" id="scheduledTime" value="${scheduledTime}" ${disabled} onclick="this.showPicker && this.showPicker()" style="cursor:pointer">
    </div>`;
  } else if (triggerType === 'fixed') {
    const cycle = (p && p.triggerCycle) || 'monthly';
    const dayOfWeek = (p && p.triggerDayOfWeek !== undefined) ? p.triggerDayOfWeek : 1;
    const dayOfMonth = (p && p.triggerDayOfMonth) ? p.triggerDayOfMonth : 1;
    const triggerTime = (p && p.triggerTime) ? p.triggerTime : '08:00';
    // 待发送状态：执行周期和周几/日期置灰，仅执行时间可编辑
    html += `<div class="form-row" style="align-items:flex-end">
      <div class="form-group">
        <label>执行周期</label>
        <select id="fixedCycle" ${disabled || pendingDisabled} onchange="onFixedCycleChange()">
          <option value="daily" ${cycle==='daily'?'selected':''}>每日</option>
          <option value="weekly" ${cycle==='weekly'?'selected':''}>每周</option>
          <option value="monthly" ${cycle==='monthly'?'selected':''}>每月</option>
        </select>
      </div>
      <div class="form-group" id="fixedDayGroup" style="${cycle==='daily'?'display:none':''}">
        <label>${cycle==='weekly'?'周几':'日期'}</label>
        ${cycle==='weekly' ? `
        <select id="fixedDayOfWeek" ${disabled || pendingDisabled}>
          <option value="1" ${dayOfWeek==1?'selected':''}>周一</option>
          <option value="2" ${dayOfWeek==2?'selected':''}>周二</option>
          <option value="3" ${dayOfWeek==3?'selected':''}>周三</option>
          <option value="4" ${dayOfWeek==4?'selected':''}>周四</option>
          <option value="5" ${dayOfWeek==5?'selected':''}>周五</option>
          <option value="6" ${dayOfWeek==6?'selected':''}>周六</option>
          <option value="0" ${dayOfWeek==0?'selected':''}>周日</option>
        </select>` : `
        <input type="number" id="fixedDayOfMonth" value="${dayOfMonth}" min="1" max="28" ${disabled || pendingDisabled} onblur="onMonthDayBlur()">`}
      </div>
      <div class="form-group">
        <label>执行时间</label>
        <input type="time" id="fixedTime" value="${triggerTime}" ${disabled}>
      </div>
    </div>`;
  } else if (triggerType === 'relative') {
    // 相对时间：从字段注册表的「时间类(datetime)字段」中选择 + 延迟 N 小时
    const timeFields = getDatetimeFields();
    const existingField = (p && p.relativeField) || (timeFields[0] ? timeFields[0].field : 'reg_time');
    const safeField = timeFields.some(f => f.field === existingField) ? existingField : (timeFields[0]?.field || 'reg_time');
    const existingDelay = (p && p.relativeDelay !== undefined && p.relativeDelay !== null && p.relativeDelay !== '')
      ? p.relativeDelay
      : (p && p.relativeTo !== undefined && p.relativeTo !== null && p.relativeTo !== '' ? p.relativeTo : 24);

    html += `<div class="form-row">
      <div class="form-group">
        <label>触发节点</label>
        <select id="relativeField" ${disabled || pendingDisabled}>
          ${timeFields.map(f => `<option value="${f.field}" ${f.field === safeField ? 'selected' : ''}>${formatTriggerNodeLabel(f.label)}</option>`).join('')}
        </select>
      </div>
      <div class="form-group">
        <label>延迟时间</label>
        <div style="display:flex;align-items:center;gap:6px">
          <input type="number" id="relativeDelay" value="${existingDelay}" min="0" max="999" step="1" style="width:80px" ${disabled || pendingDisabled} onblur="clampHourInput('relativeDelay')">
          <span>小时</span>
        </div>
      </div>
    </div>`;
  }

  return html;
}

function onPushTypeChange() {
  const type = document.getElementById('pushType').value;
  const triggerSection = document.getElementById('triggerSection');
  const timeSection = document.getElementById('timeSection');
  if (type === 'auto') {
    triggerSection.style.display = '';
    timeSection.style.display = 'none';
  } else {
    triggerSection.style.display = 'none';
    timeSection.style.display = '';
  }
  // 控制防骚扰设置显隐
  const noRepeatSection = document.getElementById('noRepeatSection');
  if (noRepeatSection) {
    if (type === 'manual') {
      noRepeatSection.style.display = 'none';
    } else {
      const tt = document.getElementById('triggerTypeSelect')?.value || 'fixed';
      noRepeatSection.style.display = (tt === 'fixed' || tt === 'scheduled') ? 'none' : '';
    }
  }
  updateSaveBtnLabel();
  refreshTriggerSection();
}

function onPushLinkChange() {
  const link = document.getElementById('pushLink').value;
  window._lastLinkVal = link || 'msg_detail';
  const h5Section = document.getElementById('h5LinkSection');
  if (h5Section) {
    h5Section.style.display = link === 'h5' ? '' : 'none';

// 人群变更后刷新触发配置联动
function refreshTriggerSection() {
  const type = document.getElementById('pushType')?.value;
  if (type !== 'auto') return;
  const triggerSection = document.getElementById('triggerSection');
  if (!triggerSection || triggerSection.style.display === 'none') return;

  const disabled = document.getElementById('pushType')?.disabled ? 'disabled' : '';
  const audienceConstraints = getAudienceConstraints(editingAudience);

  // 读取当前触发方式值
  let tt = 'fixed';
  const existing = document.getElementById('triggerTypeSelect');
  if (existing) {
    tt = existing.value || 'fixed';
  }

  // 如果不支持相对且当前是 relative，切回 fixed
  const effectiveType = (!audienceConstraints.allowRelative && tt === 'relative') ? 'fixed' : tt;

  // 找到触发方式的父容器 form-group，替换内容
  const formGroup = existing?.closest('.form-group');
  if (formGroup) {
    const label = formGroup.querySelector('label');
    if (audienceConstraints.allowRelative) {
      formGroup.innerHTML = label.outerHTML + `<select id="triggerTypeSelect" ${disabled} onchange="onTriggerTypeChange()">
        <option value="scheduled" ${effectiveType==='scheduled'?'selected':''}>定时发送</option>
        <option value="fixed" ${effectiveType==='fixed'?'selected':''}>重复时间</option>
        <option value="relative" ${effectiveType==='relative'?'selected':''}>相对时间</option>
      </select>`;
    } else {
      formGroup.innerHTML = label.outerHTML + `<select id="triggerTypeSelect" ${disabled} onchange="onTriggerTypeChange()">
        <option value="scheduled" ${effectiveType==='scheduled'?'selected':''}>定时发送</option>
        <option value="fixed" ${effectiveType!=='scheduled'?'selected':''}>重复时间</option>
      </select>`;
    }
  }

  // 更新触发参数区
  const params = document.getElementById('triggerParams');
  if (params) {
    params.innerHTML = renderTriggerParams(effectiveType, null, disabled, editingAudience);
  }
}

// ===== 目标人群条件构造器（新建面板）=====
function newEmptyCondition() {
  return { field: '', op: '', value: '', value2: '' };
}

function isRuleGroup(node) {
  return node && typeof node === 'object' && Array.isArray(node.conditions);
}

// 通过路径字符串("0-1")定位条件树节点的父分组与索引
function pathToArr(s) { return s === '' ? [] : s.split('-').map(Number); }

function getGroupByPath(arr) {
  let g = editingAudienceRule;
  for (const idx of arr) { g = g.conditions[idx]; }
  return g;
}
function getNodeByPath(arr) {
  if (arr.length === 0) return editingAudienceRule;
  const parent = getGroupByPath(arr.slice(0, -1));
  return parent.conditions[arr[arr.length - 1]];
}

// 非高级模式：扁平条件 + 逐连接符(ops)。按「或」优先级把连续的「或」聚成括号组，再用「且」连接
function buildRuleFromFlat(conds, ops) {
  ops = ops || [];
  if (!conds || conds.length === 0) return { logic: 'AND', conditions: [] };
  const segments = [];
  let cur = [conds[0]];
  for (let i = 1; i < conds.length; i++) {
    if (ops[i - 1] === 'OR') cur.push(conds[i]);
    else { segments.push(cur); cur = [conds[i]]; }
  }
  segments.push(cur);
  const topConds = segments.map(seg => seg.length === 1 ? seg[0] : { logic: 'OR', conditions: seg });
  return { logic: 'AND', conditions: topConds };
}

// 取「生效规则树」：按 ops 把扁平条件归一化为嵌套树（连续「或」聚为 OR 组）
function getEffectiveRule() {
  return buildRuleFromFlat(editingAudienceRule.conditions, editingAudienceRule.ops);
}

// ===== 刷新时随机组合目标人群（含自定义条件） =====
const GROUP_CHAT_AUDIENCE_FIELDS = ['group_join_cnt', 'group_role', 'chat_msg_cnt_30d', 'chat_msg_cnt_7d'];

function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function randInt(min, max) {
  return min + Math.floor(Math.random() * (max - min + 1));
}
function randPick(arr) {
  return arr[randInt(0, arr.length - 1)];
}
function randBool(p) {
  return Math.random() < p;
}

function getAllAudienceFieldDefs() {
  const out = [];
  for (const g of audienceFieldRegistry) {
    for (const f of g.fields) out.push(f);
  }
  return out;
}

function buildRandomConditionValue(def) {
  const ops = audienceOperators[def.type] || [];
  const op = randPick(ops);
  const c = { field: def.field, op: op.op };
  if (def.type === 'number') {
    if (op.op === 'between') {
      const a = randInt(1, 40);
      c.value = a;
      c.value2 = a + randInt(5, 30);
    } else {
      c.value = def.unit === '%' ? randInt(1, 100) : randInt(1, 50);
    }
  } else if (def.type === 'enum') {
    const n = randInt(1, Math.min(2, def.options.length));
    c.value = shuffleArray(def.options).slice(0, n);
  } else if (def.type === 'bool') {
    c.value = randBool(0.5) ? 'true' : 'false';
  }
  return c;
}

function generateRandomAudienceFlat(options) {
  const { requireGroupChat = false } = options || {};
  const allFields = getAllAudienceFieldDefs();
  const nonGroupFields = allFields.filter(f => !GROUP_CHAT_AUDIENCE_FIELDS.includes(f.field));
  const condCount = randInt(1, requireGroupChat ? 3 : 2);
  const conditions = [];
  const ops = [];

  if (requireGroupChat) {
    const gf = findAudienceFieldDef(randPick(GROUP_CHAT_AUDIENCE_FIELDS));
    if (gf) conditions.push(buildRandomConditionValue(gf));
  }

  while (conditions.length < condCount) {
    conditions.push(buildRandomConditionValue(randPick(nonGroupFields)));
  }

  for (let i = 1; i < conditions.length; i++) {
    ops.push(randBool(0.25) ? 'OR' : 'AND');
  }

  return { logic: 'AND', conditions, ops };
}

function buildAudienceSummaryFromData(audience, flatRule, combine) {
  const allTagValues = audienceTags.map(t => t.value);
  const eff = (flatRule && flatRule.conditions && flatRule.conditions.length)
    ? buildRuleFromFlat(flatRule.conditions, flatRule.ops || [])
    : { logic: 'AND', conditions: [], ops: [] };
  const hasCustom = countConditions(eff) > 0;

  let tagPart = '';
  if (audience.length > 0 && audience.length === allTagValues.length) {
    tagPart = '全部用户';
  } else if (audience.length > 0) {
    const names = audience.map(getAudienceLabel);
    tagPart = names.length > 1 ? '（' + names.join(' 或 ') + '）' : names[0];
  }

  let customPart = '';
  if (hasCustom) {
    const s = summarizeRule(eff);
    customPart = countConditions(eff) > 1 ? '（' + s + '）' : s;
  }

  if (!tagPart && !customPart) return '全部用户';
  if (tagPart && customPart) return tagPart + (combine === 'AND' ? ' 且 ' : ' 或 ') + customPart;
  return tagPart || customPart;
}

function hasCustomAudienceRule(item) {
  if (item.audienceRule && countConditions(item.audienceRule) > 0) return true;
  return !!(item.audienceFlat && item.audienceFlat.conditions && item.audienceFlat.conditions.length > 0);
}

function getPushEffectiveRule(item) {
  if (item.audienceRule && item.audienceRule.conditions) return item.audienceRule;
  if (item.audienceFlat && item.audienceFlat.conditions && item.audienceFlat.conditions.length) {
    return buildRuleFromFlat(item.audienceFlat.conditions, item.audienceFlat.ops || []);
  }
  return null;
}

function randomizePushAudienceData() {
  const templates = JSON.parse(JSON.stringify(pushSeedTemplates));
  const n = templates.length;
  const maxCustom = Math.floor(n * 0.3);
  const customCount = maxCustom > 0 ? randInt(1, maxCustom) : 0;
  const customIndices = customCount > 0 ? shuffleArray(templates.map((_, i) => i)).slice(0, customCount) : [];
  const groupChatIndex = customCount > 0 ? randPick(customIndices) : null;
  const allTagValues = audienceTags.map(t => t.value);

  return templates.map((push, idx) => {
    const p = { ...push };

    if (randBool(0.12)) {
      p.audience = [...allTagValues];
    } else {
      const cnt = randInt(1, Math.min(3, allTagValues.length));
      p.audience = shuffleArray(allTagValues).slice(0, cnt);
    }
    p.audienceCombine = randBool(0.2) ? 'OR' : 'AND';

    if (customIndices.includes(idx)) {
      const flat = generateRandomAudienceFlat({ requireGroupChat: idx === groupChatIndex });
      const eff = buildRuleFromFlat(flat.conditions, flat.ops || []);
      p.audienceFlat = flat;
      p.audienceRule = JSON.parse(JSON.stringify(eff));
      p.audienceSummary = buildAudienceSummaryFromData(p.audience, flat, p.audienceCombine);
    } else {
      delete p.audienceFlat;
      delete p.audienceRule;
      p.audienceSummary = buildAudienceSummaryFromData(p.audience, null, p.audienceCombine);
    }

    return p;
  });
}

function renderAudienceCustomPopup() {
  const eff = getEffectiveRule();
  const cnt = countConditions(eff);
  // 存在未填完的条件时，「完成」置灰不可点击
  const hasIncomplete = (editingAudienceRule.conditions || []).some(c => !isConditionComplete(c));
  return `<div class="aud-popup-mask" onclick="if(event.target===this)closeCustomPopup()">
    <div class="aud-popup">

      </div>

      <div class="aud-popup-foot">
        <span class="aud-est-result">${cnt > 0 ? '已设置 ' + cnt + ' 个条件' : '未设置条件'}</span>
        <button type="button" class="aud-popup-done" ${hasIncomplete ? 'disabled' : ''} title="${hasIncomplete ? '请先完善或删除未填完的条件' : ''}" onclick="closeCustomPopup()">完成</button>
      </div>

function openCustomPopup() {
  audienceCustomPopupOpen = true;
  // 尚无条件时，预置一条空条件并展开，便于直接编辑
  if (editingAudienceRule.conditions.length === 0) {
    editingAudienceRule.conditions.push(newEmptyCondition());
    editingAudienceRule.ops = [];
    audiencePreviewExpanded = 0;
  }
  rerenderAudienceBuilder();
}

function closeCustomPopup() {
  // 清理未填完的空条件，避免残留
  if (Array.isArray(editingAudienceRule.conditions)) {
    const keep = [];
    const ops = editingAudienceRule.ops || [];
    const newOps = [];
    editingAudienceRule.conditions.forEach((c, i) => {
      if (isConditionComplete(c)) {
        if (keep.length > 0) newOps.push(ops[i - 1] || 'AND');
        keep.push(c);
      }
    });
    editingAudienceRule.conditions = keep;
    editingAudienceRule.ops = newOps;
  }
  audienceCustomPopupOpen = false;
  audiencePreviewExpanded = null;
  editingAudienceEstimate = '';
  rerenderAudienceBuilder();
}

// 已选人群预览：把「快捷人群」+「自定义条件」合并展示，便于一眼看清最终圈选范围
// 非高级模式：预览区里的自定义条件以「胶囊」展示，点胶囊展开编辑；
// 每个连接符可单独点按切换「且/或」；连续的「或」两侧加明显括号，表示括号内任一满足即可
function renderPreviewCustomEditable() {
  const conds = editingAudienceRule.conditions;
  const ops = editingAudienceRule.ops || [];
  const parts = [];
  conds.forEach((c, i) => {
    // 连接符（位于第 i 个胶囊之前，对应 ops[i-1]）
    if (i > 0) {
      const op = ops[i - 1] === 'OR' ? 'OR' : 'AND';
      const cls = op === 'OR' ? 'aud-logic-link is-or' : 'aud-logic-link is-and';
      parts.push(`<span class="${cls}" onclick="toggleConnector(${i - 1})" title="点击切换 且/或">${op === 'OR' ? '或' : '且'}</span>`);
    }
    // 左括号：当前是某段「或」连续区间的起点
    if (ops[i] === 'OR' && (i === 0 || ops[i - 1] !== 'OR')) {
      parts.push('<span class="aud-paren">（</span>');
    }
    {
      const complete = isConditionComplete(c);
      const label = complete ? summarizeCondition(c) : '新条件…';
      const active = audiencePreviewExpanded === i ? 'active' : '';
      parts.push(`<span class="aud-cond-pill ${active} ${complete ? '' : 'incomplete'}" onclick="togglePreviewCond(${i})">${escapeHtml(label)}</span>`);
    }
    // 右括号：当前是某段「或」连续区间的终点
    if (ops[i - 1] === 'OR' && (i === conds.length - 1 || ops[i] !== 'OR')) {
      parts.push('<span class="aud-paren">）</span>');
    }
  });
  parts.push(`<button type="button" class="aud-add-pill" onclick="addPreviewCondition()">+ 添加条件</button>`);

  let editor = '';
  const cur = audiencePreviewExpanded;
  if (cur !== null && conds[cur] && !isRuleGroup(conds[cur])) {
    editor = `<div class="aud-cond-editor">${renderConditionRow(conds[cur], String(cur))}</div>`;
  }
  return `<div class="aud-pv-conds">${parts.join('')}</div>${editor}`;
}

function togglePreviewCond(i) {
  audiencePreviewExpanded = (audiencePreviewExpanded === i) ? null : i;
  rerenderAudienceBuilder();
}

function addPreviewCondition() {
  if (editingAudienceRule.conditions.length > 0) {
    if (!Array.isArray(editingAudienceRule.ops)) editingAudienceRule.ops = [];
    editingAudienceRule.ops.push('AND');
  }
  editingAudienceRule.conditions.push(newEmptyCondition());
  audiencePreviewExpanded = editingAudienceRule.conditions.length - 1;
  editingAudienceEstimate = '';
  rerenderAudienceBuilder();
}

// 切换第 i 个连接符（ops[i]）的且/或
function toggleConnector(i) {
  if (!Array.isArray(editingAudienceRule.ops)) editingAudienceRule.ops = [];
  editingAudienceRule.ops[i] = editingAudienceRule.ops[i] === 'OR' ? 'AND' : 'OR';

}


// 合成最终人群的可读描述
function buildAudienceSummary() {
  const allTags = audienceTags.map(t => t.value);
  const eff = getEffectiveRule();
  const hasCustom = countConditions(eff) > 0;

  let tagPart = '';
  if (editingAudience.length > 0 && editingAudience.length === allTags.length) {
    tagPart = '全部用户';
  } else if (editingAudience.length > 0) {
    const names = editingAudience.map(getAudienceLabel);
    tagPart = names.length > 1 ? '（' + names.join(' 或 ') + '）' : names[0];
  }

  let customPart = '';
  if (hasCustom) {
    const s = summarizeRule(eff);
    customPart = countConditions(eff) > 1 ? '（' + s + '）' : s;
  }

  if (!tagPart && !customPart) return '全部用户';
  if (tagPart && customPart) return tagPart + (editingAudienceCombine === 'AND' ? ' 且 ' : ' 或 ') + customPart;
  return tagPart || customPart;
}

function renderConditionRow(c, ps) {
  const fieldOptions = audienceFieldRegistry.map(g =>
    `<optgroup label="${g.group}">${g.fields.map(f =>
      `<option value="${f.field}" ${c.field === f.field ? 'selected' : ''}>${f.label}</option>`).join('')}</optgroup>`
  ).join('');

  const def = findAudienceFieldDef(c.field);
  let opSelect = '<select class="aud-op" disabled><option>—</option></select>';
  let valControl = '';
  if (def) {
    const ops = audienceOperators[def.type] || [];
    opSelect = `<select class="aud-op" onchange="onCondOpChange('${ps}', this.value)">
      ${ops.map(o => `<option value="${o.op}" ${c.op === o.op ? 'selected' : ''}>${o.label}</option>`).join('')}
    </select>`;
    valControl = renderValueControl(c, def, ps);
  }

  return `<div class="aud-cond">
    <select class="aud-field" onchange="onCondFieldChange('${ps}', this.value)">
      <option value="">选择字段…</option>
      ${fieldOptions}
    </select>
    ${opSelect}
    <span class="aud-val">${valControl}</span>
    <button type="button" class="aud-del-btn" onclick="removeCondition('${ps}')">删除条件</button>
  </div>`;
}

function renderValueControl(c, def, ps) {
  if (def.type === 'number') {
    const unit = def.unit === '%' ? `<span class="aud-unit">%</span>` : '';
    if (c.op === 'between') {
      return `<input type="number" value="${c.value ?? ''}" placeholder="最小" oninput="setCondValue('${ps}', this.value)" style="width:80px">
        <span class="aud-unit">~</span>
        <input type="number" value="${c.value2 ?? ''}" placeholder="最大" oninput="setCondValue2('${ps}', this.value)" style="width:80px">${unit}`;
    }
    return `<input type="number" value="${c.value ?? ''}" placeholder="数值" oninput="setCondValue('${ps}', this.value)">${unit}`;
  }
  if (def.type === 'enum') {
    const sel = Array.isArray(c.value) ? c.value : [];
    return `<span class="aud-enum-chips">${def.options.map(o =>
      `<span class="aud-enum-chip ${sel.includes(o) ? 'on' : ''}" onclick="toggleEnumValue('${ps}', '${o}')">${o}</span>`).join('')}</span>`;
  }
  if (def.type === 'bool') {
    return `<select onchange="setCondValue('${ps}', this.value)">
      <option value="">请选择</option>
      <option value="true" ${c.value === 'true' || c.value === true ? 'selected' : ''}>是</option>
      <option value="false" ${c.value === 'false' || c.value === false ? 'selected' : ''}>否</option>
    </select>`;
  }
  if (def.type === 'datetime') {
    if (c.op === 'between_hours') {
      return `<span class="aud-unit">距今</span>
        <input type="number" value="${c.value ?? ''}" placeholder="N" min="0" max="999" oninput="setCondValue('${ps}', this.value)" style="width:70px">
        <span class="aud-unit">~</span>
        <input type="number" value="${c.value2 ?? ''}" placeholder="M" min="0" max="999" oninput="setCondValue2('${ps}', this.value)" style="width:70px">
        <span class="aud-unit">小时</span>`;
    }
    if (c.op === 'within_days' || c.op === 'before_days') {
      return `<input type="number" value="${c.value ?? ''}" placeholder="天数" oninput="setCondValue('${ps}', this.value)"><span class="aud-unit">天</span>`;
    }
    return `<input type="date" value="${c.value ?? ''}" onchange="setCondValue('${ps}', this.value)">`;
  }
  return '';
}

    editingAudienceRule.ops.splice(idx > 0 ? idx - 1 : 0, 1);

}
function onCondFieldChange(ps, field) {
  const c = getNodeByPath(pathToArr(ps));

function setCondValue2(ps, v) { getNodeByPath(pathToArr(ps)).value2 = v; editingAudienceEstimate = ''; syncDoneBtn(); }

// —— 校验 / 摘要 / 预估 ——
function isConditionComplete(c) {
  const def = findAudienceFieldDef(c.field);
  if (!def || !c.op) return false;
  if (def.type === 'enum') return Array.isArray(c.value) && c.value.length > 0;
  if (def.type === 'bool') return c.value === 'true' || c.value === 'false' || c.value === true || c.value === false;
  if (def.type === 'number' && c.op === 'between') return c.value !== '' && c.value !== null && c.value2 !== '' && c.value2 !== null;
  if (def.type === 'datetime' && c.op === 'between_hours') return c.value !== '' && c.value !== null && c.value2 !== '' && c.value2 !== null;
  return c.value !== '' && c.value !== null && c.value !== undefined;
}

// 返回 {ok, msg}；空条件视为「全部用户」，合法
function validateAudienceRule(group) {
  for (const node of group.conditions) {
    if (isRuleGroup(node)) {
      const r = validateAudienceRule(node);
      if (!r.ok) return r;
    } else if (!isConditionComplete(node)) {
      return { ok: false, msg: '请完善目标人群条件（字段/算子/值均需填写），或删除空条件' };
    }
  }
  return { ok: true };
}

function summarizeRule(group) {
  if (!group || group.conditions.length === 0) return '全部用户';
  const parts = group.conditions.map(node => {
    if (isRuleGroup(node)) return '（' + summarizeRule(node) + '）';
    return summarizeCondition(node);
  }).filter(Boolean);
  return parts.join(group.logic === 'AND' ? ' 且 ' : ' 或 ');
}

function summarizeCondition(c) {
  const def = findAudienceFieldDef(c.field);
  if (!def) return '';
  const opLabel = (audienceOperators[def.type].find(o => o.op === c.op) || {}).label || c.op;
  if (def.type === 'enum') return `${def.label}${opLabel}[${(c.value || []).join('、')}]`;
  if (def.type === 'bool') return `${def.label}${opLabel}${(c.value === 'true' || c.value === true) ? '是' : '否'}`;
  if (def.type === 'datetime') {
    if (c.op === 'between_hours') return `${def.label}距今${c.value}~${c.value2}小时`;
    if (c.op === 'within_days') return `${def.label}距今${c.value}天内`;
    if (c.op === 'before_days') return `${def.label}距今超过${c.value}天`;
    return `${def.label}${opLabel}${c.value}`;
  }
  if (def.type === 'number' && c.op === 'between') return `${def.label}介于${c.value}~${c.value2}${def.unit || ''}`;
  return `${def.label}${opLabel}${c.value}${def.unit || ''}`;
}

function countConditions(group) {
  let n = 0;
  for (const node of group.conditions) {
    if (isRuleGroup(node)) n += countConditions(node);
    else if (isConditionComplete(node)) n += 1;
  }
  return n;
}

// 模拟人数预估：仅用于原型演示，真实计算由人群服务执行
function estimateAudience() {
  const v = validateAudienceRule(getEffectiveRule());
  if (!v.ok) { showToast(v.msg); return; }
  const n = countConditions(getEffectiveRule()) + editingAudience.length;
  const base = 1268000;
  const est = n === 0 ? base : Math.max(800, Math.round(base / Math.pow(2.4, n) * (0.8 + Math.random() * 0.4)));
  editingAudienceEstimate = `预计覆盖约 <b>${est.toLocaleString()}</b> 人 <span style="color:var(--text-muted)">（模拟数据，实际以人群服务计算为准）</span>`;
  const el = document.getElementById('audEstResult');
  if (el) el.innerHTML = editingAudienceEstimate;
}

// ===== 优先级冲突检测 =====
// 将自定义条件规则归一化为可比较的字符串：子条件排序后拼接，故与录入顺序无关
function canonicalizeRule(node) {
  if (!node) return '';
  if (isRuleGroup(node)) {
    const children = node.conditions.map(canonicalizeRule).filter(Boolean).sort();
    if (children.length === 0) return '';
    if (children.length === 1) return children[0];
    return (node.logic || 'AND') + '(' + children.join(',') + ')';
  }
  if (!isConditionComplete(node)) return '';
  let val = node.value;
  if (Array.isArray(val)) val = val.slice().sort().join('|');
  let s = node.field + ':' + node.op + ':' + val;
  if (node.op === 'between') s += '~' + (node.value2 ?? '');
  return s;
}

// audience: 当前推送目标人群标签数组
// priority: 当前推送优先级数值
// excludeId: 排除自身的推送ID（编辑时用）
// audienceRule: 当前推送自定义条件规则（条件树），可为空
// 返回：true 表示无冲突，false 表示有冲突（已阻止后续操作）
function checkPriorityConflict(audience, priority, excludeId, audienceRule) {
  const conflictItems = [];
  const curRuleKey = audienceRule ? canonicalizeRule(audienceRule) : '';
  pushes.forEach(p => {
    if (excludeId && p.id === excludeId) return;
    if (p.status !== 'running' && p.status !== 'pending') return;
    if (Number(p.priority) !== Number(priority)) return;

    const reasons = [];
    // 1) 快捷人群标签存在交集
    if (p.audience && p.audience.length && audience && audience.length) {
      const intersected = p.audience.filter(tag => audience.includes(tag));
      if (intersected.length > 0) {
        const intersectedNames = intersected.map(tag => {
          const found = audienceTags.find(t => t.value === tag);
          return found ? found.label.split('（')[0] : tag;
        }).join('、');
        reasons.push('相同人群标签：' + intersectedNames);
      }
    }
    // 2) 自定义条件完全相同
    if (curRuleKey && getPushEffectiveRule(p) && canonicalizeRule(getPushEffectiveRule(p)) === curRuleKey) {
      reasons.push('自定义条件完全相同');
    }

    if (reasons.length === 0) return;
    conflictItems.push({ name: p.name, priority: p.priority, reason: reasons.join('；') });
  });
  if (conflictItems.length > 0) {
    const names = conflictItems.slice(0, 3).map((item, i) => `${i + 1}. ${item.name}（优先级 ${item.priority}，冲突原因：${item.reason}）`).join('<br>');
    const moreHint = conflictItems.length > 3 ? `<br>等共 ${conflictItems.length} 条` : '';
    showModal(`优先级冲突检测<br><br>以下推送与当前推送存在相同的目标人群（含快捷标签或自定义条件）且优先级同为 <b>${priority}</b>，可能导致推送行为不可预测：<br><br>${names}${moreHint}<br><br>请调整优先级数值或修改目标人群后再保存。`, null);
    return false;
  }
  return true;
}

// ===== 保存 =====
function savePush(action) {
  const name = document.getElementById('pushName').value.trim();
  const pushType = document.getElementById('pushType').value;
  const title = document.getElementById('pushTitle').value.trim();
  const subtitle = document.getElementById('pushSubtitle').value.trim();
  const contentId = document.getElementById('articleSelect')?.value || '';
  const link = document.getElementById('pushLink').value.trim();
  const linkUrl = document.getElementById('h5LinkUrl')?.value.trim() || '';
  const pushTypeForSave = document.getElementById('pushType').value;
  const triggerTypeForSave = document.getElementById('triggerTypeSelect')?.value || 'fixed';
  const hideNoRepeat = pushTypeForSave === 'manual' || (pushTypeForSave === 'auto' && (triggerTypeForSave === 'fixed' || triggerTypeForSave === 'scheduled'));
  const noRepeatEl = document.getElementById('noRepeat');
  const noRepeat = hideNoRepeat ? null : (noRepeatEl ? noRepeatEl.checked : true);

  if (!name) { showToast('请输入推送名称'); return; }
  if (!title) { showToast('请输入推送标题'); return; }
  if (editingChannels.length === 0) { showToast('请至少选择一个推送渠道'); return; }
  // 新建、编辑(非待发送)：校验条件构造器规则；查看/待发送：沿用原标签必填校验
  const existingPushForSave = editingId ? pushes.find(e => e.id === editingId) : null;
  const isPendingEditSave = !!(existingPushForSave && existingPushForSave.status === 'pending');
  const useAudienceBuilder = (drawerMode === 'new' || (drawerMode === 'edit' && !isPendingEditSave));
  const hasExistingRule = !!(existingPushForSave && (existingPushForSave.audienceRule || (existingPushForSave.audienceSummary !== undefined && existingPushForSave.audienceSummary !== '')));
  if (useAudienceBuilder) {
    const audienceValidation = validateAudienceRule(getEffectiveRule());
    if (!audienceValidation.ok) { showToast(audienceValidation.msg); return; }
  } else if (!hasExistingRule) {
    if (editingAudience.length === 0) { showToast('请至少选择一个目标人群'); return; }
  }
  if (link === 'h5' && !linkUrl) { showToast('请输入链接地址'); return; }
  
  // 如果选择了文章，校验文章有效性
  if (contentId) {
    const article = articles.find(a => a.id === contentId);
    if (!article || article.disabled) { 
      showToast('所选文章已失效，请重新选择文章'); 
      return; 
    }
  }

  let triggerType = '';
  let triggerDesc = '';
  let pushTime = '';
  let priority = 3;
  let triggerCycle = '';
  let triggerDayOfWeek = null;
  let triggerDayOfMonth = null;
  let triggerTimeVal = '';
  let relativeFieldVal = '';
  let relativeDelayVal = 0;

  const priorityVal = document.getElementById('pushPriority').value;
  if (priorityVal === '' || priorityVal === null || priorityVal === undefined) {
    showToast('请填写优先级'); return;
  }
  priority = parseFloat(priorityVal);
  if (isNaN(priority) || priority < 0 || priority > 100) { showToast('优先级需在0-100之间'); return; }
  // 保留最多1位小数
  priority = Math.round(priority * 10) / 10;

  // 优先级冲突检测（复用于保存和启用暂停状态）
  const currentRuleForConflict = useAudienceBuilder
    ? (countConditions(getEffectiveRule()) > 0 ? getEffectiveRule() : null)
    : (existingPushForSave ? existingPushForSave.audienceRule : null);
  if (!checkPriorityConflict(editingAudience, priority, editingId, currentRuleForConflict)) {
    return;
  }

  if (pushType === 'auto') {
    triggerType = document.getElementById('triggerTypeSelect').value;
    if (!triggerType) { showToast('请选择触发方式'); return; }

    if (triggerType === 'scheduled') {
      const scheduledTime = document.getElementById('scheduledTime').value;
      if (!scheduledTime) { showToast('请选择发送时间'); return; }
      pushTime = scheduledTime;
      triggerDesc = `定时发送 ${scheduledTime}`;
    } else if (triggerType === 'fixed') {
      const cycle = document.getElementById('fixedCycle').value;
      const time = document.getElementById('fixedTime').value;
      triggerCycle = cycle;
      triggerTimeVal = time;
      if (cycle === 'daily') {
        triggerDesc = `每日 ${time}`;
      } else if (cycle === 'weekly') {
        const dow = parseInt(document.getElementById('fixedDayOfWeek').value);
        triggerDayOfWeek = dow;
        const dowMap = { 1:'周一',2:'周二',3:'周三',4:'周四',5:'周五',6:'周六',0:'周日' };
        triggerDesc = `每${dowMap[dow] || '周一'} ${time}`;
      } else {
        const day = document.getElementById('fixedDayOfMonth').value;
        triggerDayOfMonth = parseInt(day) || 1;
        triggerDesc = `每月${day}日 ${time}`;
      }
    } else if (triggerType === 'relative') {
      const field = document.getElementById('relativeField').value;
      const delay = parseInt(document.getElementById('relativeDelay').value);
      if (!field) { showToast('请选择触发节点'); return; }
      if (isNaN(delay) || delay < 0 || delay > 999) { showToast('延迟时间需为0-999的整数'); return; }
      relativeFieldVal = field;
      relativeDelayVal = delay;
      const fieldDef = findAudienceFieldDef(field);
      triggerDesc = `${fieldDef ? formatTriggerNodeLabel(fieldDef.label) : field} 延迟${delay}小时`;
    }
  } else {
    pushTime = ''; // 手动推送只能立即发送
  }

  // 手动推送：定时发送 => 待发送；立即发送 => 已发送
  const manualScheduled = pushType === 'manual' && !!pushTime;
  const manualStatus = manualScheduled ? 'pending' : 'sent';

  const now = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');

  if (editingId) {
    const p = pushes.find(e => e.id === editingId);
    if (p) {
      p.name = name;
      p.type = pushType;
      p.channels = [...editingChannels];
      p.audience = [...editingAudience];
      if (useAudienceBuilder) {
        p.audienceRule = countConditions(getEffectiveRule()) > 0 ? JSON.parse(JSON.stringify(getEffectiveRule())) : null;
        p.audienceFlat = countConditions(getEffectiveRule()) > 0 ? JSON.parse(JSON.stringify(editingAudienceRule)) : null;
        p.audienceCombine = editingAudienceCombine;
        p.audienceSummary = buildAudienceSummary();
      }
      p.triggerType = triggerType;
      p.triggerDesc = triggerDesc;
      p.triggerCycle = triggerCycle;
      p.triggerDayOfWeek = triggerDayOfWeek;
      p.triggerDayOfMonth = triggerDayOfMonth;
      p.triggerTime = triggerTimeVal;
      p.relativeField = relativeFieldVal;
      p.relativeDelay = relativeDelayVal;
      delete p.relativeFrom;
      delete p.relativeTo;
      p.priority = priority;
      p.title = title;
      p.subtitle = subtitle;
      p.content_id = contentId;
      p.link = link;
      p.linkUrl = linkUrl;
      p.pushTime = pushTime;
      p.noRepeat = noRepeat;
      if (action === 'save') {
        // 自动规则：定时发送为待发送，其他为运行中；手动推送：定时发送为待发送，立即发送为已发送
        p.status = pushType === 'auto' 
          ? (triggerType === 'scheduled' ? 'pending' : 'running')
          : manualStatus;
      }
    }
  } else {
    pushes.unshift({
      id: nextId++,
      name,
      type: pushType,
      channels: [...editingChannels],
      audience: [...editingAudience],
      audienceRule: (useAudienceBuilder && countConditions(getEffectiveRule()) > 0) ? JSON.parse(JSON.stringify(getEffectiveRule())) : null,
      audienceFlat: (useAudienceBuilder && countConditions(getEffectiveRule()) > 0) ? JSON.parse(JSON.stringify(editingAudienceRule)) : null,
      audienceCombine: useAudienceBuilder ? editingAudienceCombine : 'AND',
      audienceSummary: useAudienceBuilder ? buildAudienceSummary() : '',
      triggerType,
      triggerDesc,
      triggerCycle,
      triggerDayOfWeek,
      triggerDayOfMonth,
      triggerTime: triggerTimeVal,
      relativeField: relativeFieldVal,
      relativeDelay: relativeDelayVal,
      priority,
      status: action === 'save' 
        ? (pushType === 'auto' 
          ? (triggerType === 'scheduled' ? 'pending' : 'running')
          : manualStatus) 
        : 'draft',
      title,
      subtitle,
      content_id: contentId,
      link,
      linkUrl,
      pushTime,
      noRepeat,
      createTime: now,
      creator: '当前用户'
    });
  }

  if (action === 'save' && pushType === 'manual') {
    showToast(manualScheduled ? '已设置定时发送' : '推送已发送', 'success');
  } else {
    showToast('保存成功', 'success');
  }
  closeDrawer();
  refreshTable();
}

// ===== 发送确认 =====
let sendTargetId = null;

function openSendConfirm(id) {
  sendTargetId = id;
  const p = pushes.find(e => e.id === id);
  if (!p) return;

  const channelStr = (p.channels || []).map(c => getChannelLabel(c)).join('、');
  const totalAudienceTags = audienceTags.length;
  let audienceStr;
  if (p.audienceSummary !== undefined && p.audienceSummary !== '') {
    audienceStr = p.audienceSummary || '全部用户';
  } else if ((p.audience || []).length === totalAudienceTags) {
    audienceStr = '全部用户';
  } else {
    audienceStr = (p.audience || []).map(a => getAudienceLabel(a)).join('、');
  }

  document.getElementById('sendModalMsg').innerHTML = `
    即将发送推送「<b>${escapeHtml(p.name)}</b>」<br><br>
    渠道：${channelStr}<br>
    目标人群：${audienceStr}<br>
    标题：${escapeHtml(p.title)}<br>
    副标题：${escapeHtml(p.subtitle || '(无)')}
  `;

  document.getElementById('sendModalWarning').style.display = 'none';
  document.getElementById('sendModal').style.display = 'flex';
}

function closeSendModal() {
  sendTargetId = null;
  document.getElementById('sendModal').style.display = 'none';
}

function confirmSend() {
  if (sendTargetId !== null) {
    const p = pushes.find(e => e.id === sendTargetId);
    if (p) {
      p.status = 'sent';
      const now = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
      p.createTime = now;
    }
    sendTargetId = null;
    document.getElementById('sendModal').style.display = 'none';
    refreshTable();
    showToast('推送已发送', 'success');
  }
}

// ===== 自动规则开关 =====
function toggleAutoRule(id) {
  const p = pushes.find(e => e.id === id);
  if (!p) return;
  if (p.status === 'running') {
    p.status = 'paused';
    showToast('规则已暂停');
  } else if (p.status === 'paused') {
    // 校验文章有效性
    if (p.content_id) {
      const article = articles.find(a => a.id === p.content_id);
      if (!article || article.disabled) {
        showToast('关联文章已失效，请修改文章后再启用', 'error');
        return;
      }
    }
    // 优先级冲突检测
    if (!checkPriorityConflict(p.audience || [], p.priority, p.id, p.audienceRule || null)) {
      return;
    }
    p.status = 'running';
    showToast('规则已启用');
  }
  refreshTable();
}

// ===== 取消定时（待发送 → 草稿）=====
function cancelSchedule(id) {
  const p = pushes.find(e => e.id === id);
  if (!p) return;
  if (confirm('确定取消该推送的定时发送吗？取消后将转为草稿。')) {
    p.status = 'draft';
    p.pushTime = '';
    refreshTable();
    showToast('已取消定时，转为草稿');
  }
}

// ===== 文章列表渲染 =====
let contentCurrentPage = 1;
const contentPageSize = 10;

function refreshContentTable() {
  const search = document.getElementById('contentSearchInput')?.value || '';
  const statusFilter = document.getElementById('contentStatusFilter')?.value || '';
  let data = articles;
  if (search) {
    const q = search.toLowerCase();
    data = data.filter(d => d.title.toLowerCase().includes(q));
  }
  if (statusFilter === 'enabled') data = data.filter(d => !d.disabled);
  if (statusFilter === 'disabled') data = data.filter(d => d.disabled);
  const total = data.length;
  const start = (contentCurrentPage - 1) * contentPageSize;
  const paged = data.slice(start, start + contentPageSize);
  renderContentTable(paged);
  document.getElementById('contentPagination').innerHTML = renderContentPagination(total, contentCurrentPage, contentPageSize);
}

function renderContentTable(data) {
  const tbody = document.getElementById('contentTableBody');
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:48px;color:#9ca3af;font-size:13px">暂无文章</td></tr>';
    return;
  }
  tbody.innerHTML = data.map((item, idx) => {
    const refCount = pushes.filter(p => p.content_id === item.id).length;
    return `
      <tr>
        <td>${idx + 1}</td>
        <td>
          <span style="font-family:monospace;font-size:12px;color:var(--accent)">${escapeHtml(item.id)}</span>
          <span class="copy-id-btn" onclick="copyArticleId('${escapeHtml(item.id)}')" title="复制ID">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </span>
        </td>
        <td><div class="td-ellipsis" title="${escapeHtml(item.title)}">${escapeHtml(item.title)}</div></td>
        <td>
          <label class="toggle-switch">
            <input type="checkbox" ${item.disabled ? '' : 'checked'} onchange="toggleContentDisabled('${item.id}', this.checked)">
            <span class="toggle-slider"></span>
          </label>
        </td>
        <td>${refCount}</td>
        <td>${item.updateTime}</td>
        <td class="col-actions">
          <button class="btn-edit-text" onclick="openContentDrawer('view', '${item.id}')">查看</button>
          <button class="btn-edit-text" onclick="openContentDrawer('edit', '${item.id}')">编辑</button>
          <button class="btn-danger-text" onclick="deleteContent('${item.id}')">删除</button>
        </td>
      </tr>
    `;
  }).join('');
}

function renderContentPagination(total, page, pageSize) {
  const totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) return '';
  let html = `<span class="page-info">共 ${total} 条</span>`;
  html += `<button ${page === 1 ? 'disabled' : ''} onclick="goContentPage(${page - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="${i === page ? 'active' : ''}" onclick="goContentPage(${i})">${i}</button>`;
  }
  html += `<button ${page === totalPages ? 'disabled' : ''} onclick="goContentPage(${page + 1})">›</button>`;
  return html;
}

function goContentPage(page) { contentCurrentPage = page; refreshContentTable(); }
function filterContentData() { contentCurrentPage = 1; refreshContentTable(); }
function resetContentFilters() {
  document.getElementById('contentSearchInput').value = '';
  document.getElementById('contentStatusFilter').value = '';
  contentCurrentPage = 1;
  refreshContentTable();
}

function copyArticleId(id) {
  navigator.clipboard.writeText(id).then(() => {
    showToast('已复制 ' + id);
  }).catch(() => {
    // 降级方案
    const ta = document.createElement('textarea');
    ta.value = id;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制 ' + id);
  });
}

function toggleContentDisabled(id, enabled) {
  const a = articles.find(e => e.id === id);
  if (!a) return;
  a.disabled = !enabled;
  a.updateTime = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-').replace(/(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})/, '$1 $2');
  
  // 如果是禁用文章，将关联的推送改为暂停状态
  if (!enabled) {
    pushes.forEach(p => {
      if (p.content_id === id && (p.status === 'running' || p.status === 'pending')) {
        p.status = 'paused';
      }
    });
    refreshTable();
  } else {
    // 启用文章时，恢复推送状态
    const now = new Date();
    let hasOverdue = false;
    
    pushes.forEach(p => {
      if (p.content_id === id) {
        if (p.status === 'paused') {
          if (p.triggerType === 'scheduled' && p.pushTime) {
            const pushTime = new Date(p.pushTime);
            if (pushTime <= now) {
              hasOverdue = true;
            } else {
              p.status = 'pending';
            }
          } else {
            p.status = 'running';
          }
        }
      }
    });
    
    refreshTable();
    
    if (hasOverdue) {
      showToast('当前任务已过期，无法启用', 'error');
      // 将禁用恢复为启用状态
      a.disabled = false;
      return;
    }
  }
  
  showToast(enabled ? '文章已启用' : '文章已禁用，关联推送已暂停', 'success');
}

// ===== 文章编辑器 =====
function openContentDrawer(mode, id) {
  contentEditingId = (mode === 'edit') ? id : null;
  const titleMap = { new: '新建文章', edit: '编辑文章', view: '文章详情' };
  document.getElementById('contentDrawerTitle').textContent = titleMap[mode];

  let a = null;
  if (id) a = articles.find(e => e.id === id);

  const isView = mode === 'view';
  renderContentForm(a, isView);
  document.getElementById('btnContentSave').style.display = isView ? 'none' : '';
  document.getElementById('btnContentCancel').textContent = isView ? '关闭' : '取消';
  document.getElementById('contentDrawerOverlay').classList.add('open');
  document.getElementById('contentDrawer').classList.add('open');
}

function deleteContent(id) {
  const a = articles.find(e => e.id === id);
  if (!a) return;
  const refCount = pushes.filter(p => p.content_id === id).length;
  let msg = `确定删除文章「${escapeHtml(a.title)}」吗？删除后不可恢复。`;
  if (refCount > 0) {
    msg = `该文章已被 ${refCount} 条推送关联，删除后这些关联推送将自动转为「暂停」，且「选择文章」重置为「-- 不选择文章 --」。<br>确定删除「${escapeHtml(a.title)}」吗？删除后不可恢复。`;
  }
  openDeleteModal('删除文章', msg, () => {
    // 关联推送：清空所选文章并转为暂停
    pushes.forEach(p => {
      if (p.content_id === id) {
        p.content_id = '';
        p.status = 'paused';
      }
    });
    articles = articles.filter(e => e.id !== id);
    refreshContentTable();
    refreshTable();
    showToast(refCount > 0 ? `已删除，${refCount} 条关联推送已转为暂停` : '已删除');
  });
}

function closeContentDrawer() {
  document.getElementById('contentDrawerOverlay').classList.remove('open');
  document.getElementById('contentDrawer').classList.remove('open');
  contentEditingId = null;
}

// ===== 通用富文本编辑器组件（加粗 / 换行 / 图片 / PDF）=====
const RichTextEditor = {
  _savedRanges: {},

  render({ id = 'rteEditor', readonly = false, placeholder = '在此编辑内容...' } = {}) {
    const ph = escapeHtml(placeholder);
    if (readonly) {
      return `<div class="rte-wrap">
        <div id="${id}" class="rte-editor" contenteditable="false" data-placeholder="${ph}"></div>
      </div>`;
    }
    return `<div class="rte-wrap">
      <div class="rte-toolbar">
        <button type="button" class="rte-btn" title="加粗" onmousedown="event.preventDefault()" onclick="RichTextEditor.fmtBold('${id}')"><b>B</b> 加粗</button>
        <button type="button" class="rte-btn" title="换行" onmousedown="event.preventDefault()" onclick="RichTextEditor.fmtLineBreak('${id}')">↩ 换行</button>
        <span class="rte-divider"></span>
        <button type="button" class="rte-btn rte-btn-media" onmousedown="RichTextEditor.saveSelection('${id}')" onclick="RichTextEditor.triggerImageUpload('${id}')">＋ 图片</button>
        <button type="button" class="rte-btn rte-btn-media" onmousedown="RichTextEditor.saveSelection('${id}')" onclick="RichTextEditor.triggerAttachUpload('${id}')">＋ PDF</button>
      </div>
      <input type="file" id="${id}_img" accept="image/*" style="display:none" onchange="RichTextEditor.handleImageUpload('${id}', this)">
      <input type="file" id="${id}_pdf" accept="application/pdf" style="display:none" onchange="RichTextEditor.handleAttachUpload('${id}', this)">
      <div id="${id}" class="rte-editor" contenteditable="true" data-placeholder="${ph}"></div>
    </div>`;
  },

  init(id, html) {
    const el = document.getElementById(id);
    if (el) el.innerHTML = this._prepareHtml(html || '');
  },

  getHtml(id) {
    const el = document.getElementById(id);
    if (!el) return '';
    let html = el.innerHTML;
    html = html.replace(/\s*contenteditable="false"/g, '');
    html = html.replace(/&nbsp;/g, ' ');
    html = html.trim();
    if (html === '<br>' || html === '<p></p>' || html === '<p><br></p>') html = '';
    return html;
  },

  _prepareHtml(html) {
    if (!html) return '';
    return html.replace(/<a class="attach-card"/g, '<a class="attach-card" contenteditable="false"');
  },

  _editor(id) {
    return document.getElementById(id);
  },

  fmtBold(id) {
    this._editor(id)?.focus();
    document.execCommand('bold');
  },

  fmtLineBreak(id) {
    this._editor(id)?.focus();
    document.execCommand('insertHTML', false, '<br>');
  },

  saveSelection(id) {
    const sel = window.getSelection();
    const editor = this._editor(id);
    if (sel && sel.rangeCount > 0 && editor) {
      const range = sel.getRangeAt(0);
      if (editor.contains(range.commonAncestorContainer)) {
        this._savedRanges[id] = range.cloneRange();
        return;
      }
    }
    this._savedRanges[id] = null;
  },

  insertHtml(id, htmlStr) {
    const editor = this._editor(id);
    if (!editor) return;
    editor.focus();
    const sel = window.getSelection();
    sel.removeAllRanges();
    const saved = this._savedRanges[id];
    if (saved) {
      sel.addRange(saved);
    } else {
      const range = document.createRange();
      range.selectNodeContents(editor);
      range.collapse(false);
      sel.addRange(range);
    }
    document.execCommand('insertHTML', false, htmlStr);
    this._savedRanges[id] = null;
  },

  triggerImageUpload(id) {
    document.getElementById(id + '_img')?.click();
  },

  handleImageUpload(id, input) {
    const file = input.files && input.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { showToast('请选择图片文件'); input.value = ''; return; }
    if (file.size > 5 * 1024 * 1024) { showToast('图片大小不能超过 5MB'); input.value = ''; return; }
    const reader = new FileReader();
    reader.onload = e => {
      this.insertHtml(id, `<img src="${e.target.result}" alt="${escapeHtml(file.name)}"><p><br></p>`);
      showToast('图片已插入', 'success');
    };
    reader.readAsDataURL(file);
    input.value = '';
  },

  triggerAttachUpload(id) {
    document.getElementById(id + '_pdf')?.click();
  },

  handleAttachUpload(id, input) {
    const file = input.files && input.files[0];
    if (!file) return;
    if (file.type !== 'application/pdf') { showToast('请选择 PDF 文件'); input.value = ''; return; }
    if (file.size > 20 * 1024 * 1024) { showToast('附件大小不能超过 20MB'); input.value = ''; return; }
    const url = URL.createObjectURL(file);
    const card = `<a class="attach-card" href="${url}" target="_blank" contenteditable="false">` +
      `<span class="attach-icon">PDF</span>` +
      `<span class="attach-info"><span class="attach-name">${escapeHtml(file.name)}</span><span class="attach-size">${this.formatFileSize(file.size)}</span></span>` +
      `</a><p><br></p>`;
    this.insertHtml(id, card);
    showToast('PDF 已插入', 'success');
    input.value = '';
  },

  formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }
};
