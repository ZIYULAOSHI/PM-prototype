function generateArticleId() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const dd = String(d.getDate()).padStart(2, '0');
  const datePrefix = `${y}${m}${dd}`;
  // 找当天已有文章的最大序号
  const todayArticles = articles.filter(a => a.id.startsWith(`ART_${datePrefix}_`));
  let maxSeq = 0;
  todayArticles.forEach(a => {
    const seq = parseInt(a.id.split('_').pop());
    if (seq > maxSeq) maxSeq = seq;
  });
  const seq = String(maxSeq + 1).padStart(3, '0');
  return `ART_${datePrefix}_${seq}`;
}

function saveContent() {
  const title = document.getElementById('contentTitle').value.trim();
  const body = RichTextEditor.getHtml('contentBody');
  const enabled = document.getElementById('contentEnabled')?.checked ?? true;
  if (!title) { showToast('请输入文章标题'); return; }
  if (!body) { showToast('请输入文章正文'); return; }

  const now = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-').replace(/(\d{4}-\d{2}-\d{2}) (\d{2}:\d{2}:\d{2})/, '$1 $2');

  if (contentEditingId) {
    const a = articles.find(e => e.id === contentEditingId);
    if (a) {
      a.title = title;
      a.body = body;
      a.disabled = !enabled;
      a.updateTime = now;
    }
  } else {
    articles.unshift({
      id: generateArticleId(),
      title,
      body,
      disabled: !enabled,
      updateTime: now,
      creator: '当前用户'
    });
  }

  showToast('文章已保存', 'success');
  closeContentDrawer();
  if (currentMainPage === 'pushContent') refreshContentTable();
}

// ===== 推送表单中的文章选择器 =====
function renderArticleSelector(selectedId, isView, isDisabled) {
  if (isView || isDisabled) {
    if (!selectedId) return '<span style="color:var(--text-muted);font-size:12px">未选择</span>';
    const a = articles.find(e => e.id === selectedId);
    const isDisabledArticle = a && a.disabled;
    return `<span style="font-size:13px;color:var(--text)">${a ? escapeHtml(a.title) : '(已删除)'}${isDisabledArticle ? ' <span style="color:var(--danger);font-size:12px">[失效]</span>' : ''}</span>`;
  }
  // 只显示有效的文章
  const validArticles = articles.filter(a => !a.disabled);
  let html = `<select id="articleSelect" style="width:100%" onchange="onArticleSelectChange()">
    <option value="">-- 不选择文章 --</option>`;
  validArticles.forEach(a => {
    html += `<option value="${a.id}" ${a.id === selectedId ? 'selected' : ''}>${escapeHtml(a.title)}</option>`;
  });
  html += `</select>`;
  if (validArticles.length === 0) {
    html += '<div class="hint" style="margin-top:4px;color:var(--warning)">暂无已发布的文章，请先在「推送内容」中创建并启用文章</div>';
  }
  return html;
}

function onArticleSelectChange() {
  updateSubtitleHint();
  const articleId = document.getElementById('articleSelect')?.value || '';
  const linkSelect = document.getElementById('pushLink');
  const h5Section = document.getElementById('h5LinkSection');
  if (linkSelect) {
    if (articleId) {
      linkSelect.innerHTML = `<option value="">--</option>`;
      linkSelect.disabled = true;
      linkSelect.style.background = '#f4f5f8';
      linkSelect.style.color = 'var(--text-secondary)';
      if (h5Section) h5Section.style.display = 'none';
    } else {
      const currentVal = window._lastLinkVal || 'msg_detail';
      const linkHtml = linkOptions.map(o => `<option value="${o.value}" ${o.value === currentVal ? 'selected' : ''}>${o.label}</option>`).join('');
      linkSelect.innerHTML = linkHtml;
      linkSelect.disabled = false;
      linkSelect.style.background = '';
      linkSelect.style.color = '';
    }
  }
}

// ===== 优先级输入失焦校验 =====
function onPriorityBlur() {
  const input = document.getElementById('pushPriority');
  if (!input) return;
  const val = input.value.trim();
  if (val === '') {
    input.classList.remove('input-error');
    return;
  }
  const num = parseFloat(val);
  // 非数值或超出范围 → 清空+标红+提示
  if (isNaN(num) || num < 0 || num > 100) {
    input.value = '';
    input.classList.add('input-error');
    showToast('请输入0-100范围内的数值', 'error');
    return;
  }
  // 合法数值 → 四舍五入保留1位小数
  input.value = Math.round(num * 10) / 10;
  input.classList.remove('input-error');
}

function onMonthDayBlur() {
  const input = document.getElementById('fixedDayOfMonth');
  if (!input) return;
  const val = input.value.trim();
  if (val === '') {
    input.classList.remove('input-error');
    return;
  }
  const num = parseFloat(val);
  if (isNaN(num) || num < 1 || num > 28) {
    input.value = '';
    input.classList.add('input-error');
    showToast('请输入1-28范围内的整数', 'error');
    return;
  }
  input.value = Math.round(num);
  input.classList.remove('input-error');
}

// 小时输入校验（0-999 整数），用于「相对时间」的延迟时间
function clampHourInput(id) {
  const input = document.getElementById(id);
  if (!input) return;
  const val = input.value.trim();
  if (val === '') {
    input.classList.remove('input-error');
    return;
  }
  const num = parseFloat(val);
  if (isNaN(num) || num < 0 || num > 999) {
    input.value = '';
    input.classList.add('input-error');
    showToast('请输入0-999范围内的整数', 'error');
    return;
  }
  input.value = Math.round(num);
  input.classList.remove('input-error');
}

function updateSubtitleHint() {
  const hint = document.getElementById('subtitleHint');
  if (!hint) return;
  hint.innerHTML = '';
}

// ===== Toast =====
function showToast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ===== Modal =====
function showModal(htmlContent, onConfirm) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  const cancelBtn = document.getElementById('modalCancel');
  if (!overlay || !content) return;
  content.innerHTML = htmlContent;
  overlay.style.display = 'flex';
  const close = function() { overlay.style.display = 'none'; };
  cancelBtn.onclick = function() { close(); if (typeof onConfirm === 'function') onConfirm(false); };
}

function closeModal() {
  const overlay = document.getElementById('modalOverlay');
  if (overlay) overlay.style.display = 'none';
}

// ===== 初始化 =====
refreshTable();
