<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化王管理后台 - 语料包管理</title>
<style>
:root {
  --bg: #f4f5f8;
  --surface: #fafbfd;
  --sidebar-bg: #1a1d24;
  --sidebar-text: #9ba3b4;
  --sidebar-active: #e8edf5;
  --sidebar-active-bg: rgba(74, 108, 247, 0.1);
  --text: #1e2130;
  --text-secondary: #6b7280;
  --text-muted: #9ca3af;
  --border: #e5e7ed;
  --accent: #3b6df0;
  --primary: #3b6df0;
  --accent-light: #e8edf9;
  --danger: #e5484d;
  --danger-light: #fef2f2;
  --success: #30a46c;
  --success-light: #eef9f2;
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --radius: 6px;
  --radius-lg: 10px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  --transition: 180ms cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  display: flex;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Sidebar */
.sidebar {
  width: 220px;
  min-width: 220px;
  background: var(--sidebar-bg);
  display: flex;
  flex-direction: column;
  user-select: none;
}

.sidebar-logo {
  padding: 20px 18px 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}

.sidebar-logo h1 {
  font-size: 16px;
  font-weight: 700;
  color: #e8edf5;
  letter-spacing: .5px;
}

.sidebar-logo span {
  font-size: 11px;
  color: var(--sidebar-text);
  display: block;
  margin-top: 2px;
  font-weight: 400;
}

.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}

.nav-section {
  margin-bottom: 4px;
}

.nav-item {
  display: flex;
  align-items: center;
  padding: 9px 18px;
  color: var(--sidebar-text);
  cursor: pointer;
  transition: all var(--transition);
  font-size: 13px;
  gap: 10px;
  border-left: 2px solid transparent;
  text-decoration: none;
}

.nav-item:hover {
  color: #c8cedb;
  background: rgba(255,255,255,0.03);
}

.nav-item.active {
  color: #c8d4f7;
  background: rgba(59, 109, 240, 0.12);
  border-left-color: var(--accent);
  font-weight: 600;
}

.nav-item .icon {
  width: 18px;
  height: 18px;
  opacity: 0.6;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-item.active .icon { opacity: 0.9; }

.nav-group-header {
  display: flex;
  align-items: center;
  padding: 9px 18px;
  color: var(--sidebar-text);
  cursor: pointer;
  font-size: 13px;
  gap: 10px;
  transition: all var(--transition);
}

.nav-group-header:hover {
  color: #c8cedb;
  background: rgba(255,255,255,0.03);
}

.nav-group-header .arrow {
  margin-left: auto;
  font-size: 10px;
  transition: transform var(--transition);
}

.nav-group.open .nav-group-header .arrow {
  transform: rotate(90deg);
}

.nav-sub {
  overflow: hidden;
  max-height: 0;
  transition: max-height 250ms ease;
}

.nav-group.open .nav-sub {
  max-height: 200px;
}

.nav-sub .nav-item {
  padding-left: 46px;
  font-size: 12.5px;
}

/* Main Area */
.main-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.top-bar {
  height: 48px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  flex-shrink: 0;
}

.breadcrumb {
  font-size: 13px;
  color: var(--text-secondary);
}

.breadcrumb span {
  color: var(--text-muted);
  margin: 0 6px;
}

.breadcrumb .current {
  color: var(--text);
  font-weight: 600;
}

.content {
  flex: 1;
  overflow-y: auto;
  padding: 20px 24px;
}

/* Page Header */
.page-header {
  margin-bottom: 18px;
}

.page-header h2 {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
}

/* Filter Bar */
.filter-bar {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 16px;
  box-shadow: var(--shadow-sm);
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

.filter-bar input[type="text"],
.filter-bar select {
  height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 10px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  transition: border-color var(--transition);
  outline: none;
}

.filter-bar input[type="text"]:focus,
.filter-bar select:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.filter-bar input[type="text"] {
  width: 220px;
}

.filter-bar select {
  width: 130px;
}

.filter-bar input::placeholder {
  color: var(--text-muted);
}

/* Multi-select dropdown */
.multiselect {
  position: relative;
  width: 160px;
}

.multiselect-display {
  height: 34px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0 10px;
  font-size: 13px;
  color: var(--text);
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  cursor: pointer;
  transition: border-color var(--transition);
  user-select: none;
}

.multiselect.open .multiselect-display {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.multiselect-display .ms-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.multiselect-display .ms-text.placeholder {
  color: var(--text-muted);
}

.multiselect-display .ms-arrow {
  font-size: 10px;
  color: var(--text-muted);
  transition: transform var(--transition);
  flex-shrink: 0;
}

.multiselect.open .ms-arrow {
  transform: rotate(180deg);
}

.multiselect-dropdown {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  min-width: 100%;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-md);
  padding: 4px;
  z-index: 100;
  display: none;
  max-height: 240px;
  overflow-y: auto;
}

.multiselect.open .multiselect-dropdown {
  display: block;
}

.ms-option {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
  border-radius: 4px;
  font-size: 13px;
  color: var(--text);
  cursor: pointer;
  white-space: nowrap;
}

.ms-option:hover {
  background: var(--bg);
}

.ms-option input {
  width: 14px;
  height: 14px;
  cursor: pointer;
  accent-color: var(--accent);
}

.btn {
  height: 34px;
  padding: 0 16px;
  border-radius: var(--radius);
  font-size: 13px;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  font-weight: 500;
  transition: all var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover {
  background: #2f5cd6;
}

.btn-default {
  background: #fff;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-default:hover {
  background: var(--bg);
  border-color: #cdd2db;
}

.btn-new {
  margin-left: auto;
}

.btn-danger-text {
  color: var(--danger);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius);
}
.btn-danger-text:hover {
  background: var(--danger-light);
}

.btn-edit-text {
  color: var(--accent);
  background: none;
  border: none;
  padding: 4px 10px;
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  border-radius: var(--radius);
  margin-right: 2px;
}
.btn-edit-text:hover {
  background: var(--accent-light);
}

/* Table */
.table-container {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
}

table {
  width: 100%;
  border-collapse: collapse;
}

thead th {
  background: #f8f9fb;
  padding: 11px 14px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-secondary);
  text-align: left;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  text-transform: none;
  letter-spacing: 0;
}

tbody td {
  padding: 12px 14px;
  font-size: 13px;
  border-bottom: 1px solid #f0f1f5;
  color: var(--text);
  vertical-align: middle;
}

tbody tr:last-child td {
  border-bottom: none;
}

tbody tr:hover {
  background: #fafbfd;
}

.td-ellipsis {
  max-width: 180px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.td-similar {
  max-width: 200px;
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.5;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.td-answer {
  max-width: 220px;
  font-size: 13px;
  line-height: 1.55;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
  word-break: break-all;
}

/* Switch */
.switch {
  position: relative;
  display: inline-block;
  width: 40px;
  height: 22px;
  cursor: pointer;
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.switch .slider {
  position: absolute;
  inset: 0;
  background: #d1d5db;
  border-radius: 22px;
  transition: all 200ms ease;
}

.switch .slider::before {
  content: '';
  position: absolute;
  width: 18px;
  height: 18px;
  left: 2px;
  bottom: 2px;
  background: #fff;
  border-radius: 50%;
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 1px 2px rgba(0,0,0,0.12);
}

.switch input:checked + .slider {
  background: var(--success);
}

.switch input:checked + .slider::before {
  transform: translateX(18px);
}

/* Status Badge */
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
}

.status-badge::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
}

.status-badge.enabled { color: var(--success); }
.status-badge.enabled::before { background: var(--success); }
.status-badge.disabled { color: var(--text-muted); }
.status-badge.disabled::before { background: var(--text-muted); }

/* Pagination */
.pagination {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding: 14px 20px;
  gap: 6px;
  border-top: 1px solid #f0f1f5;
}

.pagination .page-info {
  font-size: 12.5px;
  color: var(--text-secondary);
  margin-right: 10px;
}

.pagination button {
  width: 32px;
  height: 32px;
  border: 1px solid var(--border);
  background: #fff;
  border-radius: var(--radius);
  cursor: pointer;
  font-size: 13px;
  color: var(--text);
  transition: all var(--transition);
  font-family: var(--font);
}

.pagination button:hover {
  border-color: var(--accent);
  color: var(--accent);
}

.pagination button.active {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

.pagination button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

/* Category Tag */
.category-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11.5px;
  font-weight: 500;
  white-space: nowrap;
}

.cat-open { background: #eef2ff; color: #4f46e5; }
.cat-fee { background: #fef3c7; color: #b45309; }
.cat-strategy { background: #ecfdf5; color: #047857; }
.cat-indicator { background: #fdf2f8; color: #be185d; }
.cat-broker { background: #eff6ff; color: #2563eb; }
.cat-tech { background: #fef2f2; color: #dc2626; }
.cat-other { background: #f9fafb; color: #6b7280; }

.category-classes {
  '开户': 'cat-open',
  '收费': 'cat-fee',
  '策略': 'cat-strategy',
  '指标': 'cat-indicator',
  '券商': 'cat-broker',
  '技术问题': 'cat-tech',
  '其他': 'cat-other'
}

/* Delete Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  animation: fadeIn 150ms ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal {
  background: #fff;
  border-radius: var(--radius-lg);
  padding: 24px;
  width: 400px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  animation: slideUp 200ms cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes slideUp {
  from { transform: translateY(12px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

.modal h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 8px;
}

.modal p {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 20px;
}

.modal-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* Right Side Drawer */
.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.4);
  z-index: 999;
  opacity: 0;
  visibility: hidden;
  transition: opacity 200ms ease, visibility 200ms ease;
}

.drawer-overlay.open {
  opacity: 1;
  visibility: visible;
}

.drawer {
  position: fixed;
  top: 0;
  right: 0;
  width: 480px;
  height: 100vh;
  background: var(--surface);
  box-shadow: -4px 0 20px rgba(0, 0, 0, 0.12);
  z-index: 1000;
  transform: translateX(100%);
  transition: transform 250ms cubic-bezier(0.16, 1, 0.3, 1);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.drawer.open {
  transform: translateX(0);
}

.drawer-header {
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}

.drawer-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin: 0;
}

.drawer-body {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.drawer-footer {
  padding: 20px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  flex-shrink: 0;
}

/* Edit Form */
.form-container {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 0;
  max-width: none;
}

.form-group {
  margin-bottom: 20px;
}

.form-group label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 6px;
}

.form-group label .required {
  color: var(--danger);
  font-size: 14px;
  line-height: 1;
}

.form-group .hint {
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 400;
  margin-left: 4px;
}

.form-group select,
.form-group input[type="text"],
.form-group textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 12px;
  font-size: 13px;
  font-family: var(--font);
  color: var(--text);
  background: #fff;
  outline: none;
  transition: border-color var(--transition);
}

.form-group select:focus,
.form-group input[type="text"]:focus,
.form-group textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px rgba(59, 109, 240, 0.08);
}

.form-group textarea {
  min-height: 100px;
  resize: vertical;
  line-height: 1.6;
}

.form-group textarea[name="similar"] {
  min-height: 80px;
}

.form-actions {
  display: flex;
  gap: 10px;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
}

.btn-cancel {
  background: #fff;
  color: var(--text-secondary);
  border: 1px solid var(--border);
}
.btn-cancel:hover {
  background: var(--bg);
}

/* Disabled form state for view mode */
.form-group select:disabled,
.form-group input[type="text"]:disabled,
.form-group textarea:disabled {
  background: #f4f5f8;
  color: var(--text-secondary);
  cursor: default;
  border-color: #e8e9ee;
  opacity: 1;
  -webkit-text-fill-color: var(--text-secondary);
}

/* 内联添加分类 */
.category-add-row {
  display: none;
  gap: 8px;
  align-items: center;
  margin-top: 6px;
}
.category-add-row.show {
  display: flex;
}
.category-add-row input {
  flex: 1;
  height: 32px;
  padding: 0 10px;
  border: 1px solid var(--primary);
  border-radius: 4px;
  font-size: 13px;
  outline: none;
  box-sizing: border-box;
}
.category-add-row .btn-inline {
  height: 32px;
  padding: 0 14px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  border: none;
}
.category-add-row .btn-inline-confirm {
  background: var(--primary);
  color: #fff;
}
.category-add-row .btn-inline-cancel {
  background: #f0f1f5;
  color: var(--text-secondary);
  border: 1px solid #e0e1e6;
}

/* 抽屉内 Switch 行 */
.switch-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.switch-label {
  font-size: 13px;
  color: var(--text);
}

/* 禁用态 Switch 视觉弱化 */
#editStatus:disabled + .slider,
#editStatus:disabled ~ .slider {
  opacity: 0.4;
  cursor: not-allowed;
}
.switch:has(#editStatus:disabled) {
  cursor: not-allowed;
}

/* Toast */
.toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #1e2130;
  color: #fff;
  padding: 10px 22px;
  border-radius: var(--radius);
  font-size: 13px;
  z-index: 2000;
  animation: toastIn 250ms cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
}

.toast.success { background: #166534; }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-8px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
</style>
</head>

<!-- Toast Container -->
<div id="toastContainer"></div>

<script>
// ===== 数据 =====
let corpusData = [
  {
    id: 1,
    category: '开户',
    question: '如何开通量化交易账户',
    similar: ['怎么开户', '开通账户需要什么条件', '怎么加入量化交易', '如何注册量化账户', '量化开户流程是什么', '开户要准备哪些材料', '个人可以开通吗'],
    answer: '您可以在量化王APP中点击「我的」-「量化交易」-「立即开通」，按照指引完成身份认证和风险测评，选择券商即可开通量化交易账户。目前支持山西证券、华兴证券、国新证券。',
    status: true,
    updateTime: '2026-05-28 14:30',
    updater: '李向梅'
  },
  {
    id: 2,
    category: '量化交易',
    question: '量化交易是怎么自动下单的',
    similar: ['量化怎么自动买卖', '策略到了信号会自动交易吗', '不盯盘也能交易吗', '量化交易需要手动操作吗'],
    answer: '量化交易通过您选定的策略运行，当行情触发策略设定的买入或卖出信号时，系统会自动向已开通的券商账户发送委托下单，无需手动盯盘。您可在「量化交易」页面查看实时持仓和委托记录。',
    status: true,
    updateTime: '2026-05-27 10:15',
    updater: '王静'
  },
  {
    id: 3,
    category: '回测',
    question: '如何对策略进行历史回测',
    similar: ['策略怎么回测', '回测在哪里看', '怎么测试策略效果', '回测数据准确吗'],
    answer: '在策略详情页点击「回测」，选择回测时间区间、初始资金和标的范围后点击开始，系统会基于历史行情数据模拟交易并给出收益曲线、最大回撤、胜率等指标。回测不含未来函数，结果仅供参考。',
    status: true,
    updateTime: '2026-05-26 16:45',
    updater: '李向梅'
  },
  {
    id: 4,
    category: '创建策略',
    question: '如何创建一个自己的量化策略',
    similar: ['怎么新建策略', '策略怎么编辑', '可以自定义策略吗', '不会编程能创建策略吗'],
    answer: '在「策略管理」点击「创建策略」，可通过可视化方式选择指标、设置买卖条件和参数，无需编程基础。配置完成后保存即可进行回测与模拟，验证有效后再投入实盘。',
    status: true,
    updateTime: '2026-05-25 09:20',
    updater: '张磊'
  },
  {
    id: 5,
    category: '策略',
    question: '中期彩带策略适合什么行情',
    similar: ['彩带策略怎么用', '中期彩带适合震荡市吗', '彩带策略效果好吗'],
    answer: '中期彩带策略基于趋势判断，粉色表示上升趋势、蓝色表示下降趋势，更适合趋势明显的单边行情。在震荡市中信号可能频繁，建议结合仓位管理使用，并先通过回测验证效果。',
    status: true,
    updateTime: '2026-05-24 11:00',
    updater: '王静'
  },
  {
    id: 6,
    category: 'ETF相关',
    question: '量化王支持ETF交易吗',
    similar: ['可以做ETF吗', 'ETF能用量化策略吗', '支持哪些ETF', 'ETF怎么交易'],
    answer: '量化王支持主流场内ETF的行情查看、策略回测与实盘交易。您可以在创建策略时将ETF设为交易标的，结合趋势或网格等策略进行量化操作。具体可交易品种以券商账户支持范围为准。',
    status: true,
    updateTime: '2026-05-23 15:40',
    updater: '李向梅'
  }
];

let nextId = 7;
let currentDeleteId = null;
let editingId = null;

// ===== 动态分类管理 =====
let categories = ['开户', '量化交易', '回测', '创建策略', '策略', 'ETF相关'];

function refreshCategoryOptions() {
  // 重建抽屉分类下拉（含 __add__）
  const editSel = document.getElementById('editCategory');
  const editVal = editSel.value;
  const addOpt = editSel.querySelector('option[value="__add__"]');
  editSel.innerHTML = '';
  const emptyOpt = document.createElement('option');
  emptyOpt.value = '';
  emptyOpt.textContent = '请选择分类';
  editSel.appendChild(emptyOpt);
  categories.forEach(c => {
    const o = document.createElement('option');
    o.value = c;
    o.textContent = c;
    if (c === editVal) o.selected = true;
    editSel.appendChild(o);
  });
  if (addOpt) editSel.appendChild(addOpt);

  // 重建过滤栏分类多选下拉
  renderCatFilterOptions();
}

// ===== 分类多选过滤 =====
let selectedCategories = [];

function renderCatFilterOptions() {
  const dropdown = document.getElementById('catFilterDropdown');
  // 清理已不存在的已选分类
  selectedCategories = selectedCategories.filter(c => categories.includes(c));
  dropdown.innerHTML = categories.map(c => `
    <label class="ms-option" onclick="event.stopPropagation()">
      <input type="checkbox" value="${escapeHtml(c)}" ${selectedCategories.includes(c) ? 'checked' : ''} onchange="onCatOptionToggle(this)">
      <span>${escapeHtml(c)}</span>
    </label>
  `).join('');
  updateCatFilterText();
}

function onCatOptionToggle(cb) {
  const val = cb.value;
  if (cb.checked) {
    if (!selectedCategories.includes(val)) selectedCategories.push(val);
  } else {
    selectedCategories = selectedCategories.filter(c => c !== val);
  }
  updateCatFilterText();
}

function updateCatFilterText() {
  const textEl = document.getElementById('catFilterText');
  if (selectedCategories.length === 0) {
    textEl.textContent = '所属分类';
    textEl.classList.add('placeholder');
  } else {
    textEl.textContent = selectedCategories.length === 1
      ? selectedCategories[0]
      : `已选 ${selectedCategories.length} 个分类`;
    textEl.classList.remove('placeholder');
  }
}

function toggleCatDropdown(event) {
  event.stopPropagation();
  document.getElementById('catFilter').classList.toggle('open');
}

document.addEventListener('click', function(e) {
  const wrap = document.getElementById('catFilter');
  if (wrap && !wrap.contains(e.target)) wrap.classList.remove('open');
});

function onCategoryChange(sel) {
  if (sel.value === '__add__') {
    // 确定来源标识
    const source = sel.id === 'catFilter' ? 'filter' : 'drawer';
    const row = document.getElementById('catAddRow_' + source);
    const input = document.getElementById('catAddInput_' + source);
    row.classList.add('show');
    input.value = '';
    input.focus();
    sel.value = ''; // 保持下拉回到空白选项
  }
}

function confirmAddCategory(source) {
  const input = document.getElementById('catAddInput_' + source);
  const name = input.value.trim();
  if (!name) return;
  if (categories.includes(name)) {
    showToast('该分类已存在');
    return;
  }
  categories.push(name);
  categories.sort((a, b) => a.localeCompare(b, 'zh'));
  refreshCategoryOptions();
  cancelAddCategory(source);
  // 选中新分类
  const targetSel = source === 'filter' ? document.getElementById('catFilter') : document.getElementById('editCategory');
  targetSel.value = name;
  showToast('分类「' + name + '」已添加', 'success');
}

function cancelAddCategory(source) {
  document.getElementById('catAddRow_' + source).classList.remove('show');
  document.getElementById('catAddInput_' + source).value = '';
}

// ===== 渲染表格 =====
function renderTable(data) {
  const tbody = document.getElementById('tableBody');
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:48px;color:#9ca3af;font-size:13px">暂无数据</td></tr>';
    return;
  }
  tbody.innerHTML = data.map((item, idx) => {
    const similarText = item.similar.join('，');
    const answerText = item.answer;
    const answerHtml = escapeHtml(answerText).replace(/\n/g, '<br>');
    const statusBadge = item.status
      ? '<span class="status-badge enabled">启用</span>'
      : '<span class="status-badge disabled">禁用</span>';
    const checked = item.status ? 'checked' : '';
    return `
      <tr>
        <td>${idx + 1}</td>
        <td>${item.category}</td>
        <td><div class="td-ellipsis" title="${escapeHtml(item.question)}">${escapeHtml(item.question)}</div></td>
        <td><div class="td-similar" title="${escapeHtml(similarText)}">${escapeHtml(similarText)}</div></td>
        <td><div class="td-answer" title="${escapeHtml(answerText)}">${answerHtml}</div></td>
        <td>
          <label class="switch" onclick="toggleStatus(${item.id}, event)">
            <input type="checkbox" ${checked}>
            <span class="slider"></span>
          </label>
        </td>
        <td>${item.updateTime}</td>
        <td>${item.updater}</td>
        <td>
          <button class="btn-edit-text" onclick="goView(${item.id})">查看</button>
          <button class="btn-edit-text" onclick="goEdit(${item.id})">编辑</button>
          <button class="btn-danger-text" onclick="openDeleteModal(${item.id})">删除</button>
        </td>
      </tr>
    `;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderPagination(total, page, pageSize) {
  const totalPages = Math.ceil(total / pageSize);
  if (totalPages <= 1) return '';
  let html = `<span class="page-info">共 ${total} 条</span>`;
  html += `<button ${page === 1 ? 'disabled' : ''} onclick="goPage(${page - 1})">‹</button>`;
  for (let i = 1; i <= totalPages; i++) {
    html += `<button class="${i === page ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
  }
  html += `<button ${page === totalPages ? 'disabled' : ''} onclick="goPage(${page + 1})">›</button>`;
  return html;
}

let currentPage = 1;
const pageSize = 10;

function refreshTable() {
  const search = document.getElementById('searchInput')?.value || '';
  const status = document.getElementById('statusFilter')?.value || '';
  let data = corpusData;
  if (search) {
    const q = search.toLowerCase();
    data = data.filter(d => d.question.toLowerCase().includes(q) || d.similar.some(s => s.toLowerCase().includes(q)));
  }
  if (selectedCategories.length > 0) data = data.filter(d => selectedCategories.includes(d.category));
  if (status) {
    const s = status === '启用';
    data = data.filter(d => d.status === s);
  }
  const total = data.length;
  const start = (currentPage - 1) * pageSize;
  const paged = data.slice(start, start + pageSize);
  renderTable(paged);
  document.getElementById('pagination').innerHTML = renderPagination(total, currentPage, pageSize);
}

function goPage(page) {
  currentPage = page;
  refreshTable();
}

function filterData() {
  currentPage = 1;
  refreshTable();
}

function resetFilters() {
  document.getElementById('searchInput').value = '';
  selectedCategories = [];
  renderCatFilterOptions();
  document.getElementById('statusFilter').value = '';
  currentPage = 1;
  refreshTable();
}

// ===== Switch切换 =====
function toggleStatus(id, event) {
  event.stopPropagation();
  event.preventDefault();
  const item = corpusData.find(d => d.id === id);
  if (item) {
    item.status = !item.status;
    item.updateTime = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');
    refreshTable();
    showToast(item.status ? '已启用' : '已禁用', 'success');
  }
}

// ===== 删除 =====
function openDeleteModal(id) {
  currentDeleteId = id;
  document.getElementById('deleteModal').style.display = 'flex';
}

function closeModal() {
  currentDeleteId = null;
  document.getElementById('deleteModal').style.display = 'none';
}

function confirmDelete() {
  if (currentDeleteId !== null) {
    corpusData = corpusData.filter(d => d.id !== currentDeleteId);
    currentDeleteId = null;
    document.getElementById('deleteModal').style.display = 'none';
    refreshTable();
    showToast('语料已删除');
  }
}

// ===== 抽屉开关 =====
function openDrawer() {
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('editDrawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('editDrawer').classList.remove('open');
  // 恢复表单为可编辑状态
  document.getElementById('editCategory').disabled = false;
  document.getElementById('editQuestion').disabled = false;
  document.getElementById('editSimilar').disabled = false;
  document.getElementById('editAnswer').disabled = false;
  document.getElementById('editStatus').disabled = false;
  // 隐藏内联添加分类行
  cancelAddCategory('drawer');
  editingId = null;
}

// ===== 编辑/新建 =====
function toggleDrawerStatus(e) {
  e.stopPropagation();
  if (document.getElementById('editStatus').disabled) return;
  const cb = document.getElementById('editStatus');
  cb.checked = !cb.checked;
  document.getElementById('drawerStatusLabel').textContent = cb.checked ? '启用' : '禁用';
}

function setFormEditable(editable) {
  document.getElementById('editCategory').disabled = !editable;
  document.getElementById('editQuestion').disabled = !editable;
  document.getElementById('editSimilar').disabled = !editable;
  document.getElementById('editAnswer').disabled = !editable;
  document.getElementById('editStatus').disabled = !editable;
  document.getElementById('btnSave').style.display = editable ? '' : 'none';
}

function goEdit(id) {
  editingId = id;
  setFormEditable(true);
  if (id === 'new') {
    document.getElementById('editTitle').textContent = '新建';
    document.getElementById('editCategory').value = '';
    document.getElementById('editQuestion').value = '';
    document.getElementById('editSimilar').value = '';
    document.getElementById('editAnswer').value = '';
    document.getElementById('editStatus').checked = false;
    document.getElementById('drawerStatusLabel').textContent = '禁用';
  } else {
    const item = corpusData.find(d => d.id === id);
    if (!item) return;
    document.getElementById('editTitle').textContent = '编辑';
    document.getElementById('editCategory').value = item.category;
    document.getElementById('editQuestion').value = item.question;
    document.getElementById('editSimilar').value = item.similar.join('\n');
    document.getElementById('editAnswer').value = item.answer;
    document.getElementById('editStatus').checked = item.status;
    document.getElementById('drawerStatusLabel').textContent = item.status ? '启用' : '禁用';
  }
  openDrawer();
}

function goView(id) {
  const item = corpusData.find(d => d.id === id);
  if (!item) return;
  editingId = null;
  setFormEditable(false);
  document.getElementById('editTitle').textContent = '查看';
  document.getElementById('editCategory').value = item.category;
  document.getElementById('editQuestion').value = item.question;
  document.getElementById('editSimilar').value = item.similar.join('\n');
  document.getElementById('editAnswer').value = item.answer;
  document.getElementById('editStatus').checked = item.status;
  document.getElementById('drawerStatusLabel').textContent = item.status ? '启用' : '禁用';
  openDrawer();
}

function saveCorpus() {
  const category = document.getElementById('editCategory').value;
  const question = document.getElementById('editQuestion').value.trim();
  const similarRaw = document.getElementById('editSimilar').value.trim();
  const answer = document.getElementById('editAnswer').value.trim();
  const status = document.getElementById('editStatus').checked;

  if (!category || !question || !answer) {
    showToast('请填写所有必填字段');
    return;
  }

  const similar = similarRaw ? similarRaw.split('\n').map(s => s.trim()).filter(s => s) : [];
  const now = new Date().toLocaleString('zh-CN', { hour12: false }).replace(/\//g, '-');

  if (editingId && editingId !== 'new') {
    const item = corpusData.find(d => d.id === editingId);
    if (item) {
      item.category = category;
      item.question = question;
      item.similar = similar;
      item.answer = answer;
      item.status = status;
      item.updateTime = now;
      item.updater = '当前用户';
    }
  } else {
    corpusData.unshift({
      id: nextId++,
      category,
      question,
      similar,
      answer,
      status: status,
      updateTime: now,
      updater: '当前用户'
    });
  }

  showToast('保存成功', 'success');
  closeDrawer();
  refreshTable();
}

// ===== Toast =====
function showToast(msg, type) {
  const el = document.createElement('div');
  el.className = 'toast ' + (type || '');
  el.textContent = msg;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(() => el.remove(), 2000);
}

// ===== 初始化 =====
renderCatFilterOptions();
refreshTable();
</script>
